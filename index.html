  else if(a==='calday'){S.calSel=b.dataset.v;render()}
  else if(a==='caltoday'){S.calMonth=today().slice(0,7);S.calSel=today();render()}
  else if(a==='calplan'){const dt=b.dataset.v;const cur=Object.assign({},S.days[dt]||{});cur.plan=!cur.plan;await write(()=>S.db.doc('days/'+dt).set(cur),cur.plan?'Allenamento previsto':'Previsione tolta')}
  else if(a==='mobtick'){const kind=b.dataset.kind,i=+b.dataset.i,td=today();let t=mobTicks(td,kind);t=t.includes(i)?t.filter(x=>x!==i):t.concat([i]);setMobTicks(td,kind,t);const total=kind==='S'?MOB_SHORT.length:MOB_LONG.length-1;const flag=kind==='S'?'mobS':'mobL';if(t.length===total&&!(S.days[td]||{})[flag]){await write(()=>S.db.doc('days/'+td).set(Object.assign({},S.days[td]||{},{[flag]:true})),'Routine completata')}render()}
  else if(a==='mobdone'){const kind=b.dataset.kind,td=today(),flag=kind==='S'?'mobS':'mobL';const cur=Object.assign({},S.days[td]||{});cur[flag]=!cur[flag];await write(()=>S.db.doc('days/'+td).set(cur),cur[flag]?'Routine segnata come fatta':'Routine segnata come non fatta')}
  else if(a==='addD'&&d){const {w}=S.sel.claude;const it=(TPL[w]||[]).find(x=>x.s==='D'&&x.l==='BP');if(it){d.ex.splice(2,0,{name:it.n+' (dalla D)',lift:'BP',comp:false,main:true,fromD:true,presc:'3 serie · '+itemText(it,w),planned:3,sets:planSets(mkSets(3,itemKg(it,w),it.r,'',i=>({label:String(i+1)})))});persistDraft(k);render()}}
  else if(a==='copyskip'){const txt=skipReport();try{await navigator.clipboard.writeText(txt);toast('Riepilogo copiato: incollalo nella chat con Claude')}catch(err){const ta=document.getElementById('skip-text');if(ta){ta.hidden=false;ta.focus();ta.select()}toast('Testo selezionato: copialo')}}
  else if(a==='addset'&&d){const ex=d.ex[+b.dataset.i];const last=ex.sets.at(-1)||{};ex.sets.push({kg:last.kg||'',reps:last.reps||'',rpe:'',done:false,label:String(ex.sets.length+1)});persistDraft(k);render()}
  else if(a==='delset'&&d){d.ex[+b.dataset.i].sets.pop();persistDraft(k);render()}
  else if(a==='reset'&&d){if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Tocca di nuovo per azzerare';setTimeout(()=>{b.dataset.confirm='';b.textContent='Azzera'},3000);return}dropDraft(k);render()}
  else if(a==='save'&&d){await saveSession(k,d)}
  else if(a==='dellog'){if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Tocca di nuovo per eliminare';return}await write(()=>S.db.doc('logs/'+b.dataset.id).delete(),'Seduta eliminata')}
  else if(a==='saveday'){await saveDay()}
  else if(a==='savemob'){await saveMob()}
  else if(a==='preset'){const p=PRESETS[b.dataset.v];for(const L in p.e1rm){const inp=document.getElementById('s-e-'+L);if(inp)inp.value=p.e1rm[L];const iw=document.getElementById('s-w-'+L);if(iw)iw.value=1}toast('Valori inseriti: premi Salva impostazioni')}
  else if(a==='usee1'){const L=b.dataset.l;const inp=document.getElementById('s-e-'+L);if(inp)inp.value=r25(e1Current(L));const iw=document.getElementById('s-w-'+L);if(iw)iw.value=(S.sel.claude||nextClaude()).w;toast('Valore inserito: premi Salva impostazioni')}
  else if(a==='saveset'){await saveSettings()}
  else if(a==='sync-save'){await syncExport('save')}
  else if(a==='sync-share'){await syncExport('share')}
  else if(a==='sync-pick'){const f=document.getElementById('sync-file');if(f)f.click()}
  else if(a==='sync-paste-go'){const ta=document.getElementById('sync-paste');await syncImportText(ta&&ta.value)}
  else if(a==='gosync'){S.view='set';render();setTimeout(()=>{const el=document.getElementById('sync');if(el)el.scrollIntoView()},50)}
  else if(a==='wacopy'){const ta=document.getElementById('wa-text');try{await navigator.clipboard.writeText(ta.value);toast('Messaggio copiato')}catch(err){ta.focus();ta.select();toast('Testo selezionato: copialo con il menu del telefono')}}
  else if(a==='xlsx'){if(!S.dl){toast('Salvataggio non disponibile');return}try{await S.dl.save({filename:'Progressi carichi - Diario SBD.xlsx',data:buildXlsx(progData())});toast('Excel salvato')}catch(err){const c=err&&err.code;toast(c==='declined'?'Salvataggio annullato':c==='rate_limited'?'Aspetta qualche secondo e riprova':'Salvataggio non riuscito')}}
  else if(a==='exphtml'){if(!S.dl){toast('Salvataggio non disponibile');return}try{const html=exportHtml(S.expDays);await S.dl.save({filename:'diario-sbd-luca-'+today()+'.html',data:html});toast('File salvato')}catch(err){const c=err&&err.code;toast(c==='declined'?'Salvataggio annullato':c==='rate_limited'?'Aspetta qualche secondo e riprova':'Salvataggio non riuscito')}}
  else if(a==='cw-add'){const order=(S.coach.reduce((m,w)=>Math.max(m,w.order||0),0))+1;await write(()=>S.db.collection('coachweeks').add({order,title:'Settimana '+order,sessions:[]}),'Settimana aggiunta')}
  else if(a==='cw-ren'){const inp=main.querySelector('input[data-cwt="'+b.dataset.w+'"]');await write(()=>S.db.doc('coachweeks/'+b.dataset.w).update({title:inp.value.trim()||'Settimana'}),'Rinominata')}
  else if(a==='cw-del'){if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Tocca di nuovo per eliminare';return}await write(()=>S.db.doc('coachweeks/'+b.dataset.w).delete(),'Settimana eliminata')}
  else if(a==='cs-add'){const w=S.coach.find(x=>x.id===b.dataset.w);const id='s'+Date.now().toString(36);const sessions=(w.sessions||[]).concat([{id,title:'Giorno '+((w.sessions||[]).length+1),text:'',exercises:[]}]);if(await write(()=>S.db.doc('coachweeks/'+w.id).update({sessions}))){S.editCoach={wid:w.id,sid:id,title:'Giorno '+sessions.length,text:'',lifts:{}};render()}}
  else if(a==='cs-edit'){const w=S.coach.find(x=>x.id===b.dataset.w);const s=w.sessions.find(x=>x.id===b.dataset.s);const parsed=parseCoach(s.text);const lifts={};(s.exercises||[]).forEach((e,i)=>{if(parsed[i]&&parsed[i].name===e.name)lifts[i]=e.lift||''});S.editCoach={wid:w.id,sid:s.id,title:s.title||'',text:s.text||'',lifts};render()}
  else if(a==='cs-cancel'){S.editCoach=null;render()}
  else if(a==='cs-save'){const ed=S.editCoach;const w=S.coach.find(x=>x.id===ed.wid);const parsed=parseCoach(ed.text).map((e,i)=>({name:e.name,presc:e.presc,lift:(ed.lifts&&ed.lifts[i]!=null)?ed.lifts[i]:e.lift}));const sessions=(w.sessions||[]).map(s=>s.id===ed.sid?{id:s.id,title:ed.title.trim()||'Seduta',text:ed.text,exercises:parsed}:s);if(await write(()=>S.db.doc('coachweeks/'+w.id).update({sessions}),'Seduta salvata')){dropDraft(dkey('coach',w.id,ed.sid));S.editCoach=null;render()}}
  else if(a==='cs-del'){if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Tocca di nuovo per eliminare';return}const ed=S.editCoach;const w=S.coach.find(x=>x.id===ed.wid);const sessions=(w.sessions||[]).filter(s=>s.id!==ed.sid);if(await write(()=>S.db.doc('coachweeks/'+w.id).update({sessions}),'Seduta eliminata')){S.editCoach=null;render()}}
});
async function saveSession(k,d){const parts=k.split(':');const track=parts[1];const exs=d.ex.map(ex=>({name:ex.name,lift:ex.lift||null,comp:!!ex.comp,presc:ex.presc||'',sets:ex.sets.filter(s=>s.done).map(s=>Object.assign({kg:num(s.kg),reps:num(s.reps),rpe:num(s.rpe)==null?'':num(s.rpe)},s.pct!=null?{bo:true}:{},s.target!=null?{trpe:s.target}:{})),warm:(ex.warm||[]).filter(w=>w.done).map(w=>({kg:num(w.kg),reps:num(w.reps)}))})).filter(ex=>ex.sets.length||ex.warm.length);
  if(!exs.length){toast('Segna come fatta almeno una serie (✓)');return}
  let week,session,title;if(track==='claude'){week=S.sel.claude.w;session=S.sel.claude.s;title='Sett. '+week+' · '+session+' – '+SESS_TITLE[session]}else{week=S.sel.coach.wid;session=S.sel.coach.sid;const cs=coachSession(week,session);title='Coach · '+(cs?((cs.w.title||'')+' · '+(cs.s.title||'')):'')}
  const an=analyzeDraft(d);const doc={date:d.date||today(),ts:Date.now(),track,week,session,title,devTot:an.devTot,dev:an.dev,skipped:an.skipped,exercises:exs,elbow:+d.elbow||0,notes:String(d.notes||'').slice(0,2000)};
  if(await write(()=>S.db.collection('logs').add(doc),'Seduta salvata')){dropDraft(k);if(track==='claude'){const seq=claudeSeq();const i=seq.findIndex(x=>x.w===week&&x.s===session);S.sel.claude=seq.at(Math.min(i+1,seq.length-1))}else{const seq=coachSeq();const i=seq.findIndex(x=>x.wid===week&&x.sid===session);S.sel.coach=seq.at(Math.min(i+1,seq.length-1))}stopTimer();render();window.scrollTo({top:0})}}
async function saveDay(){const date=document.getElementById('cd-date').value||today();const o={bw:num(document.getElementById('cd-bw').value),kcal:num(document.getElementById('cd-kcal').value),prot:num(document.getElementById('cd-prot').value)};await write(()=>S.db.doc('days/'+date).set(Object.assign({},S.days[date]||{},o)),'Giornata salvata')}
async function saveMob(){const date=document.getElementById('mt-date').value||today();const g=id=>num(document.getElementById(id).value);const o={wall:g('mt-wall'),sr:g('mt-sr'),sl:g('mt-sl'),grip:g('mt-grip'),lbp:!!document.getElementById('mt-lbp').value,hold:g('mt-hold')};await write(()=>S.db.doc('mobtests/'+date).set(o),'Test salvato')}
async function saveSettings(){const g=id=>document.getElementById(id).value;const o={e1rm:{},e1rmWeek:{},rate:{}};for(const L of ['SQ','BP','DL','DLR']){o.e1rm[L]=num(g('s-e-'+L))||DEFAULTS.e1rm[L];o.e1rmWeek[L]=Math.min(13,Math.max(1,Math.round(num(g('s-w-'+L))||1)));const r=num(g('s-r-'+L));o.rate[L]=r==null?DEFAULTS.rate[L]:r}
  o.bwTarget=num(g('s-bwt'));o.kcal=num(g('s-kcal'))||'';o.prot=num(g('s-prot'))||150;o.bar=num(g('s-bar'))||20;o.plates=String(g('s-plates')||'').trim()||DEFAULTS.plates;o.track=g('s-track');
  if(await write(()=>S.db.doc('config/settings').set(o),'Impostazioni salvate')){for(const key of Object.keys(S.drafts))if(key.startsWith('draft:claude'))dropDraft(key);try{for(let i=localStorage.length-1;i>=0;i--){const kk=localStorage.key(i);if(kk&&kk.startsWith('draft:claude'))localStorage.removeItem(kk)}}catch(e){}}}

/* ---------- timer ---------- */
let tEnd=0,tInt=null;function startTimer(sec){if(!sec){stopTimer();return}tEnd=Date.now()+sec*1000;clearInterval(tInt);tick();tInt=setInterval(tick,500)}
function stopTimer(){clearInterval(tInt);tInt=null;document.getElementById('tval').textContent='0:00'}
function tick(){const left=Math.max(0,Math.round((tEnd-Date.now())/1000));document.getElementById('tval').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(left<=0){clearInterval(tInt);tInt=null;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}toast('Recupero finito')}}
document.getElementById('timer').addEventListener('click',e=>{const b=e.target.closest('button[data-t]');if(b)startTimer(+b.dataset.t)});

boot();
</script>
