<script>
/* Versione offline del Diario SBD: sostituisce il database di claude.ai con uno locale (IndexedDB) sul telefono. */
(function(){
  'use strict';
  const DBN='diario-sbd',ST='docs';let mem=new Map();let idb=null;const subs=new Set();
  const cl=o=>o==null?o:JSON.parse(JSON.stringify(o));
  function openIdb(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
  async function load(){
    try{idb=await openIdb();await new Promise((res,rej)=>{const rq=idb.transaction(ST,'readonly').objectStore(ST).openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){mem.set(String(c.key),c.value);c.continue()}else res()};rq.onerror=()=>rej(rq.error)})}
    catch(e){idb=null;try{const v=localStorage.getItem('sbd:db');if(v)mem=new Map(Object.entries(JSON.parse(v)))}catch(_){}}
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(_){}
  }
  function persist(path,val){
    if(idb)return new Promise((res,rej)=>{const tx=idb.transaction(ST,'readwrite');const st=tx.objectStore(ST);if(val===undefined)st.delete(path);else st.put(val,path);tx.oncomplete=()=>res();tx.onerror=()=>rej({code:'storage_error'});tx.onabort=()=>rej({code:'storage_full'})});
    try{localStorage.setItem('sbd:db',JSON.stringify(Object.fromEntries(mem)));return Promise.resolve()}catch(e){return Promise.reject({code:'storage_full'})}
  }
  const ready=load();
  const top=k=>k.split('/');
  function fire(s){setTimeout(()=>{try{
    if(s.path){const v=mem.get(s.path);s.cb({exists:v!==undefined,id:top(s.path)[1],data:()=>cl(v)})}
    else{let docs=[];for(const [k,v] of mem){const p=top(k);if(p.length===2&&p[0]===s.coll)docs.push({id:p[1],data:()=>cl(v),_v:v})}
      if(s.ord){const [f,dir]=s.ord;docs.sort((a,b)=>{const x=a._v[f]??-Infinity,y=b._v[f]??-Infinity;const c=x<y?-1:x>y?1:0;return dir==='desc'?-c:c})}
      if(s.lim)docs=docs.slice(0,s.lim);s.cb({docs,size:docs.length,empty:!docs.length})}
  }catch(e){console.error(e)}},0)}
  function notify(path){const coll=top(path)[0];for(const s of subs)if(s.path===path||s.coll===coll)fire(s)}
  function docRef(path){return {id:top(path)[1],path,
    onSnapshot(cb){const s={path,cb};subs.add(s);ready.then(()=>fire(s));return ()=>subs.delete(s)},
    async get(){await ready;const v=mem.get(path);return {exists:v!==undefined,data:()=>cl(v)}},
    async set(d){await ready;const v=cl(d);mem.set(path,v);await persist(path,v);notify(path)},
    async update(d){await ready;const cur=mem.get(path);if(cur===undefined)throw {code:'not_found'};const v=Object.assign(cl(cur),cl(d));mem.set(path,v);await persist(path,v);notify(path)},
    async delete(){await ready;mem.delete(path);await persist(path,undefined);notify(path)}}}
  function query(coll,ord,lim){return {
    orderBy(f,dir){return query(coll,[f,dir||'asc'],lim)},limit(n){return query(coll,ord,n)},
    onSnapshot(cb){const s={coll,cb,ord,lim};subs.add(s);ready.then(()=>fire(s));return ()=>subs.delete(s)}}}
  function collRef(c){const q=query(c,null,null);q.doc=id=>docRef(c+'/'+id);q.add=async d=>{const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);await docRef(c+'/'+id).set(d);return {id}};return q}
  const db={doc:p=>docRef(p),collection:c=>collRef(c)};
  const MIME={json:'application/json',html:'text/html',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'};
  const dl={async save({filename,data,mimeType}){const ext=String(filename).split('.').pop();const blob=data instanceof Blob?data:new Blob([data],{type:mimeType||MIME[ext]||'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000)}};
  window.SBD_OFFLINE=true;
  window.claude={use:async n=>n==='db'?db:n==='user'?{can:async()=>true}:n==='downloads'?dl:null};
})();
</script>

<style>
/* Layout: one narrow column built for a phone between sets; sticky header + tab rail; cards only for exercises. Plate colours (red 25, blue 20, yellow 15) mark squat, bench, deadlift. */
:root{
  --bg:#f1f2ef; --surface:#ffffff; --sunk:#e7e9e5; --ink:#16181b; --muted:#5b6168; --line:#d8dbd7;
  --accent:#b3122a; --accent-ink:#ffffff;
  --sq:#c8202b; --bp:#1d5bbf; --dl:#c99700;
  --good:#2f8a4c; --warn:#b97400; --crit:#c0392b;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#1a1d20; --sunk:#24282c; --ink:#eceeee; --muted:#9ca3a9; --line:#2e3337;
  --accent:#ff5a68; --accent-ink:#1a0b0d; --sq:#ff5c63; --bp:#6aa2ff; --dl:#f0c348;
  --good:#5cc27d; --warn:#f0b13c; --crit:#ff6b5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1a1d20; --sunk:#24282c; --ink:#eceeee; --muted:#9ca3a9; --line:#2e3337;
  --accent:#ff5a68; --accent-ink:#1a0b0d; --sq:#ff5c63; --bp:#6aa2ff; --dl:#f0c348;
  --good:#5cc27d; --warn:#f0b13c; --crit:#ff6b5e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.brand{display:flex;align-items:baseline;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand h1{font:700 26px/1 var(--display);letter-spacing:.01em;margin:0;text-transform:uppercase}
.brand h1 span{color:var(--accent)}
.status{font-size:13px;color:var(--muted)}
.status b{font-weight:600;color:var(--ink)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav.tabs button{flex:0 0 auto;border:0;background:none;color:var(--muted);font:600 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:10px 10px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
h2{font:700 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:22px 0 8px;text-wrap:balance}
h3{font:600 18px/1.15 var(--display);letter-spacing:.02em;margin:18px 0 6px;text-transform:uppercase}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--muted);font:600 14px/1 var(--body);padding:8px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:700 18px/1 var(--display);min-width:44px;padding:9px 10px;cursor:pointer;text-align:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.done{border-color:var(--good)}

textarea{width:100%;min-height:90px;resize:vertical}
input[type=number]{width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.btn{border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:600 15px/1 var(--body);padding:12px 16px;cursor:pointer}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{border-left:4px solid var(--warn);background:var(--surface);padding:10px 12px;border-radius:0 8px 8px 0;margin:12px 0;font-size:15px}
.banner.info{border-left-color:var(--bp)}

.sess-head{margin:14px 0 4px}

.ex-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.ex-h b{font:700 19px/1.1 var(--display);letter-spacing:.01em}
.presc{font-size:14px;color:var(--muted)}
.target{font:600 15px/1.2 var(--body)}
.plates{font-size:12.5px;color:var(--muted)}
.sets{display:grid;grid-template-columns:34px minmax(0,.8fr) minmax(0,1fr) minmax(0,.75fr) minmax(0,.75fr) 44px;gap:6px;margin-top:8px;align-items:center}
.sets .hd{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sets .lb{font:600 13px/1 var(--body);color:var(--muted)}
.sets input{padding:8px 6px;text-align:center}
.ck{width:44px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);color:var(--muted);font-size:18px;cursor:pointer}
.ck[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.tag{display:inline-block;font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.tag.SQ{background:color-mix(in srgb,var(--sq) 16%,transparent);color:var(--sq)}
.tag.BP{background:color-mix(in srgb,var(--bp) 16%,transparent);color:var(--bp)}
.tag.DL,.tag.DLR{background:color-mix(in srgb,var(--dl) 20%,transparent);color:var(--dl)}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:10px 0}
summary{cursor:pointer;font:600 16px/1.2 var(--display);letter-spacing:.03em;text-transform:uppercase}
ul.plain{margin:6px 0;padding-left:18px} ul.plain li{margin:3px 0}
.tbl{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 12px/1.2 var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.k{white-space:nowrap;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.tile .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:700 30px/1.05 var(--display);font-variant-numeric:tabular-nums}
.tile .s{font-size:12.5px;color:var(--muted)}
.tile.SQ{border-top:4px solid var(--sq)} .tile.BP{border-top:4px solid var(--bp)} .tile.DL{border-top:4px solid var(--dl)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin:10px 0}
.chart svg{width:100%;height:auto;display:block}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:480px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:8px 0;padding:0}
.hist summary{padding:10px 12px;font:600 15px/1.25 var(--body);text-transform:none;letter-spacing:0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hist .body{padding:0 12px 12px}
.pain{display:inline-block;min-width:28px;text-align:center;border-radius:6px;padding:2px 6px;font-weight:600;font-size:13px;color:#fff}
.p0{background:var(--good)} .p1{background:var(--warn)} .p2{background:var(--crit)}
.save-bar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);margin-top:12px;display:flex;gap:8px}
.save-bar .btn{flex:1}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ink);color:var(--bg);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.timer{flex-wrap:nowrap;gap:6px}.timer .t{font:700 24px/1 var(--display);font-variant-numeric:tabular-nums;min-width:58px;text-align:center}
.timer button{border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);background:none;color:var(--bg);border-radius:8px;padding:7px 8px;font:600 13px/1 var(--body);cursor:pointer}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);text-align:center;margin:10px 0}
.coach-ex{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:6px;align-items:center;margin:4px 0}

.cp-off .cp-only{display:none!important}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}

.cal .day .n{font:600 13px/1 var(--body);font-variant-numeric:tabular-nums}
.cal .day .cs{display:flex;flex-wrap:wrap;gap:2px}
.cal .day .c{font:700 11px/1 var(--display);padding:2px 4px;border-radius:4px;background:var(--ink);color:var(--bg)}
.cal .day .c.coach{background:var(--bp);color:#fff}
.cal .day .c.pl{background:none;color:var(--muted);border:1px dashed var(--muted)}
.cal .day.plan{border-style:dashed;border-color:var(--muted)}
.cal .day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .day.sel{background:var(--sunk)}
.cal .day .mob{width:6px;height:6px;border-radius:50%;background:var(--good);margin-top:auto}
.cal .pad{visibility:hidden}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function r25(x){return Math.round(x/2.5)*2.5}
function fmt(n,d=1){if(n==null||n===''||isNaN(n))return '–';return Number(n).toLocaleString('it-IT',{maximumFractionDigits:d})}
function num(v){if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dms(iso){const [y,m,d]=iso.split('-').map(Number);return Date.UTC(y,m-1,d)}
function dlabel(iso){if(!iso)return '';const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y.slice(2)}
function daysBetween(a,b){return Math.round((dms(b)-dms(a))/864e5)}
function pctRPE(reps,rpe){const i=(reps-1)*2+Math.round((10-rpe)*2);if(reps<1||reps>10||rpe<6||rpe>10)return null;return RPE_SEQ.at(i)}
function e1From(kg,reps,rpe){const p=pctRPE(reps,rpe);return p?kg/(p/100):null}
function blockOf(w){return w<=1?'Calibrazione':w<=5?'Volume':w===6?'Scarico':w<=10?'Forza':w===11?'Picco':w===12?'Taper':'Test'}
function sessionsOf(w){return w===13?['T']:w===12?['A','B','C']:['A','B','C','D']}
function plates(kg){const bar=num(S.settings.bar)||20;if(!kg||kg<bar)return '';let side=(kg-bar)/2;const out=[];const ps=String(S.settings.plates||'20, 15, 10, 5, 2.5, 1.25');const av=(/[\s;]/.test(ps)?(ps.match(/\d+(?:[.,]\d+)?/g)||[]):ps.split(',')).map(x=>num(x)).filter(x=>x>0).sort((a,b)=>b-a);for(const p of av){while(side>=p-1e-6){out.push(p);side-=p}}return out.length?'Per lato: '+out.map(p=>fmt(p,2)).join(' + '):'Solo bilanciere'}
function warmFor(kg,reps){const bar=num(S.settings.bar)||20;const out=[{kg:bar,reps:10,done:false,auto:true,p:0}];if(!kg)return out;const steps=[[.4,5],[.6,3],[.75,2]];if(reps&&reps<=3)steps.push([.85,1]);let last=bar;for(const [p,r] of steps){const k=Math.max(bar,r25(kg*p));if(k>last&&k<kg){out.push({kg:k,reps:r,done:false,auto:true,p});last=k}}return out}
function e1Plan(l,w){const st=S.settings;const base=num(st.e1rm[l])||DEFAULTS.e1rm[l];const bw=num(st.e1rmWeek[l])||1;const rate=num(st.rate[l]);return base+(rate==null?DEFAULTS.rate[l]:rate)*Math.max(0,Math.min(w,11)-bw)}
function itemKg(it,w){const e=e1Plan(it.l,w);return it.t==='top'?r25(e*pctRPE(it.r,it.e)/100):r25(e*it.p/100)}
function itemText(it,w){const k=itemKg(it,w);if(it.t==='top'){let s=it.r+'@'+fmt(it.e)+' ≈'+fmt(k);if(it.bo)s+=' + '+it.bo[0]+'×'+it.bo[1]+' −'+it.bo[2]+'% ≈'+fmt(r25(k*(1-it.bo[2]/100)));return s}return it.k+'×'+it.r+' '+fmt(it.p)+'% ≈'+fmt(k)}
function accScheme(row,w){if(w<=5)return row[1];if(w===6)return row[1].replace(/^\d+×/,'2×').replace(/@\d+(,\d+)?/g,'@7');if(w<=10)return row[2];if(w===11)return row[3];return ''}
function parseScheme(s){const m=/^(\d+)×(\d+)/.exec(s||'');return m?{sets:Math.min(+m[1],8),reps:+m[2]}:{sets:3,reps:''}}

/* ---------- e1RM from logs ---------- */
function logE1(log){const out={};for(const ex of (log.exercises||[])){if(!ex.comp||!ex.lift)continue;const L=ex.lift==='DLR'?null:ex.lift;if(!L)continue;for(const s of (ex.sets||[])){const kg=num(s.kg),r=num(s.reps),e=num(s.rpe);if(!kg||!r||e==null)continue;const v=e1From(kg,r,e);if(v&&(!out[L]||v>out[L]))out[L]=v}}return out}
function e1Series(){const ser={SQ:[],BP:[],DL:[]};for(const lg of S.logs){const e=logE1(lg);for(const L in e){if(ser[L])ser[L].push({x:dms(lg.date),y:e[L],date:lg.date})}}for(const L in ser)ser[L].sort((a,b)=>a.x-b.x);return ser}
function e1Current(L){const ser=e1Series()[L]||[];if(!ser.length)return null;const last=ser.at(-1).x;const recent=ser.filter(p=>p.x>=last-21*864e5).map(p=>p.y).sort((a,b)=>b-a);const top=recent.slice(0,2);return top.reduce((s,v)=>s+v,0)/top.length}
function dots(total,bw){if(!total||!bw)return null;const A=-307.75076,B=24.0900756,C=-0.1918759221,D=0.0007391293,E=-0.000001093;const den=A+B*bw+C*bw**2+D*bw**3+E*bw**4;return total*500/den}
function latestBW(){const ds=Object.keys(S.days).filter(k=>num(S.days[k].bw)).sort();return ds.length?num(S.days[ds.at(-1)].bw):null}

/* ---------- sequence ---------- */
function claudeSeq(){const s=[];for(let w=1;w<=13;w++)for(const x of sessionsOf(w))s.push({w,s:x});return s}
function lastLog(track){return S.logs.filter(l=>l.track===track).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.ts||0)-(a.ts||0))[0]||null}
function nextClaude(){const seq=claudeSeq();const ll=lastLog('claude');if(!ll)return seq[0];const i=seq.findIndex(x=>x.w===ll.week&&x.s===ll.session);return seq.at(Math.min(i+1,seq.length-1))||seq[0]}
function coachSeq(){const out=[];for(const w of S.coach)for(const s of (w.sessions||[]))out.push({wid:w.id,sid:s.id});return out}
function nextCoach(){const seq=coachSeq();if(!seq.length)return null;const ll=lastLog('coach');if(!ll)return seq[0];const i=seq.findIndex(x=>x.wid===ll.week&&x.sid===ll.session);return seq.at(Math.min(i+1,seq.length-1))||seq[0]}
function isDone(track,w,s){return S.logs.some(l=>l.track===track&&l.week===w&&l.session===s)}

/* ---------- drafts ---------- */
function dkey(track,w,s){return 'draft:'+track+':'+w+':'+s}
function loadDraft(k){if(S.drafts[k])return S.drafts[k];try{const v=localStorage.getItem(k);if(v){S.drafts[k]=JSON.parse(v);return S.drafts[k]}}catch(e){}return null}
let saveT=null;function persistDraft(k){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(k,JSON.stringify(S.drafts[k]))}catch(e){}},300)}
function dropDraft(k){delete S.drafts[k];try{localStorage.removeItem(k)}catch(e){}}
function mkSets(n,kg,reps,rpe,extra){const a=[];for(let i=0;i<n;i++)a.push(Object.assign({kg:kg==null?'':kg,reps:reps==null?'':reps,rpe:rpe==null?'':rpe,done:false},extra?extra(i):{}));return a}
function planSets(sets){return sets.map(x=>Object.assign(x,{plan:{kg:num(x.kg),reps:num(x.reps)}}))}
function buildClaudeDraft(w,s){const ex=[];
  if(s==='T'){for(const L of ['SQ','BP','DL']){const e=e1Current(L)||e1Plan(L,13);const at=[.915,.965,1].map(f=>r25(e*f));ex.push({name:(L==='DL'?'Stacco sumo':L==='SQ'?'Squat (low bar)':'Panca'),lift:L,comp:true,main:true,presc:'3 tentativi. Massimale stimato '+fmt(r25(e))+' kg. 3° tentativo: +5/7,5 se il 2° era @8, +2,5/5 se @9, fermati o +2,5 se @9,5+',planned:3,sets:planSets(at.map((k,i)=>({kg:k,reps:1,rpe:'',done:false,label:(i+1)+'°'})))})}return {date:today(),elbow:0,notes:'',ex}}
  for(const it of (TPL[w]||[]).filter(x=>x.s===s)){const k=itemKg(it,w);let sets;
    if(it.t==='top'){sets=[{kg:k,reps:it.r,rpe:'',done:false,label:'Top',role:'top',target:it.e}];if(it.bo){const bk=r25(k*(1-it.bo[2]/100));for(let i=0;i<it.bo[0];i++)sets.push({kg:bk,reps:it.bo[1],rpe:'',done:false,label:'B'+(i+1),auto:true,pct:it.bo[2]})}}
    else sets=mkSets(it.k,k,it.r,'',i=>({label:String(i+1)}));
    ex.push({name:it.n,lift:it.l,comp:!!it.c,main:true,presc:itemText(it,w),planned:sets.length,sets:planSets(sets)})}
  const acc=ACC[s]||[];acc.forEach((row,i)=>{if(w===12&&i>1)return;const sc=w===12?'2 serie @6-7':accScheme(row,w);if(!sc)return;const p=parseScheme(sc);const n=w===12?2:p.sets;ex.push({name:row[0],lift:null,comp:false,presc:sc+(row[4]?' · '+row[4]:''),planned:n,sets:planSets(mkSets(n,'',p.reps,'',i=>({label:String(i+1)})))})});
  return {date:today(),elbow:0,notes:'',ex}}

function coachSession(wid,sid){const w=S.coach.find(x=>x.id===wid);if(!w)return null;const s=(w.sessions||[]).find(x=>x.id===sid);return s?{w,s}:null}
function presetFromCoach(presc){let sets=3,reps='',kg='',rpe='';const m=/(\d+)\s*x\s*(\d+)\s*s/i.exec(presc);if(m){reps=+m[1];sets=Math.min(+m[2],10)}const t=/(\d+)\s*@\s*(\d+(?:[.,]\d)?)/.exec(presc);if(!m&&t){reps=+t[1];sets=1;rpe=''}const k=/(\d+(?:[.,]\d+)?)\s*kg/i.exec(presc);if(k)kg=num(k[1]);return {sets,reps,kg}}
function coachRows(presc,lift){const rows=[];const e1=lift?num(S.settings.e1rm[lift]):null;let anchor=null;
  for(const raw of String(presc||'').split(/;|,(?!\d)/)){const ch=raw.trim();if(!ch)continue;
    const lst=/^(\d+(?:,\d+)+)\b[^@]*@\s*(\d+(?:[.,]\d)?)/.exec(ch);
    if(lst){const t=num(lst[2]);const st=rows.length;for(const r of lst[1].split(','))if(rows.length<20)rows.push({kg:'',reps:+r,rpe:'',done:false,target:t});anchor=st;continue}
    const bo=/^[-−–]\s*(\d+(?:[.,]\d+)?)\s*%/.exec(ch);const body=bo?ch.slice(bo[0].length):ch;
    let m=/(\d+(?:\s*\+\s*\d+)?|max\s*reps?)\s*(?:@\s*(\d+(?:[.,]\d)?)\s*)?x\s*(\d+)\s*s/i.exec(body);let reps,sets,t=null;
    if(m){reps=m[1];sets=Math.min(+m[3],10);t=m[2]?num(m[2]):null}
    else{m=/(\d+(?:\s*\+\s*\d+)?)\s*@\s*(\d+(?:[.,]\d)?)/.exec(body);if(!m)continue;reps=m[1];sets=1;t=num(m[2])}
    const rv=/max/i.test(reps)?'':+String(reps).split('+')[0];
    let kg='';const k=/(\d+(?:[.,]\d+)?)\s*kg/i.exec(body);const pc=!bo&&/(\d+(?:[.,]\d+)?)\s*%/.exec(body);if(k)kg=num(k[1]);else if(pc&&e1)kg=r25(e1*num(pc[1])/100);
    const st=rows.length;
    for(let i=0;i<sets&&rows.length<20;i++){const r={kg,reps:rv,rpe:'',done:false};if(t!=null)r.target=t;if(bo&&anchor!=null){r.pct=num(bo[1]);r.ref=anchor;r.auto=true}rows.push(r)}
    if(!bo)anchor=st}
  if(!rows.length){const p=presetFromCoach(presc);return mkSets(p.sets,p.kg,p.reps,'')}return rows}
function buildCoachDraft(wid,sid){const cs=coachSession(wid,sid);if(!cs)return null;const ex=(cs.s.exercises||[]).map(e=>{let n=0,b=0;const rows=coachRows(e.presc||'',e.lift||null).map(x=>Object.assign(x,{label:x.pct!=null?'B'+(++b):String(++n)}));return {name:e.name,lift:e.lift||null,comp:!!e.lift,main:!!(e.main||e.lift||/^(sq|bp|dl|squat|panca|stacco)\b/i.test(e.name||'')),presc:e.presc||'',planned:rows.length,sets:planSets(rows)}});return {date:today(),elbow:0,notes:'',ex}}

/* ---------- sincronizzazione telefono ↔ claude.ai (v13) ----------
   Ogni scrittura porta _mt (ms). Le eliminazioni lasciano una "lapide" in _tomb/<coll>~<id>.
   Esporta = fotografia completa in JSON. Importa = fusione: vince la versione con _mt più recente. */
const OFF=!!window.SBD_OFFLINE;const SYNC_COLLS=['config','logs','coachweeks','days','mobtests'];
function tombId(p){return p.replace('/','~')}
function wrapDb(db){const now=()=>Date.now();const st=d=>Object.assign({},d,{_mt:now()});
  const docW=p=>{const r=db.doc(p);return {set:d=>r.set(st(d)),update:d=>r.update(st(d)),delete:async()=>{await r.delete();try{await db.doc('_tomb/'+tombId(p)).set({p,_mt:now()})}catch(e){}},onSnapshot:(...a)=>r.onSnapshot(...a)}};
  return {doc:docW,collection:c=>({add:d=>db.collection(c).add(st(d)),orderBy:(...a)=>db.collection(c).orderBy(...a),onSnapshot:(...a)=>db.collection(c).onSnapshot(...a),doc:id=>docW(c+'/'+id)})}}
function syncSnapshot(){const data={config:{},logs:{},coachweeks:{},days:{},mobtests:{}};const strip=o=>{const r=clone(o);delete r.id;return r};
  if(S.rawSettings&&Object.keys(S.rawSettings).length)data.config.settings=clone(S.rawSettings);
  for(const l of S.logs)data.logs[l.id]=strip(l);for(const w of S.coach)data.coachweeks[w.id]=strip(w);for(const k in S.days)data.days[k]=clone(S.days[k]);for(const m of S.mob)data.mobtests[m.id]=strip(m);
  const tombs={};for(const k in (S.tombs||{})){const t=S.tombs[k];if(t&&t.p)tombs[t.p]=t._mt||0}
  return {app:'diario-sbd',v:1,from:OFF?'telefono':'claude',exportedAt:new Date().toISOString(),data,tombs}}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function pendingList(){if(!S.ready)return [];const m=lsGet('sbd:synced',{});const s=syncSnapshot();const out=[];
  for(const c in s.data)for(const id in s.data[c]){const mt=s.data[c][id]._mt||0;if(mt>(m[c+'/'+id]||0))out.push(c)}
  for(const p in s.tombs)if(s.tombs[p]>(m['~'+p]||0))out.push('del');return out}
function pendingText(list){if(!list.length)return 'tutto sincronizzato';const n={};for(const c of list)n[c]=(n[c]||0)+1;const lab={logs:['seduta','sedute'],coachweeks:['settimana del coach','settimane del coach'],days:['giornata','giornate'],mobtests:['test di mobilità','test di mobilità'],config:['impostazioni','impostazioni'],del:['eliminazione','eliminazioni']};return Object.keys(n).map(c=>n[c]+' '+(lab[c]||[c,c])[n[c]===1?0:1]).join(', ')}
function agoText(t){if(!t)return 'mai';const m=Math.round((Date.now()-t)/6e4);if(m<2)return 'adesso';if(m<60)return m+' minuti fa';const h=Math.round(m/60);if(h<36)return h+(h===1?' ora fa':' ore fa');const d=Math.round(h/24);return d+' giorni fa'}
function stamp(){const d=new Date();return today()+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')}
function markExported(snap){const m=lsGet('sbd:synced',{});for(const c in snap.data)for(const id in snap.data[c]){const mt=snap.data[c][id]._mt||0;if(mt>(m[c+'/'+id]||0))m[c+'/'+id]=mt}for(const p in snap.tombs)if(snap.tombs[p]>(m['~'+p]||0))m['~'+p]=snap.tombs[p];lsSet('sbd:synced',m);lsSet('sbd:lastExport',Date.now());updateStatus()}
async function syncExport(mode){const snap=syncSnapshot();const txt=JSON.stringify(snap);const name='diario-sbd-'+(OFF?'telefono':'claude')+'-'+stamp()+'.json';
  if(mode==='share'){try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Diario SBD – dati'});markExported(snap);toast('Dati condivisi');render();return}toast('Condivisione non disponibile: uso Salva file')}catch(e){if(e&&e.name==='AbortError'){toast('Condivisione annullata');return}}}
  if(!S.dl){toast('Salvataggio dei file non disponibile');return}
  try{await S.dl.save({filename:name,data:txt,mimeType:'application/json'});markExported(snap);toast('File salvato: '+name);render()}catch(err){const c=err&&err.code;toast(c==='declined'?'Salvataggio annullato':c==='rate_limited'?'Aspetta qualche secondo e riprova':'Salvataggio non riuscito')}}
async function syncImport(obj){if(ro()){toast('Non hai i permessi per modificare');return}
  if(!obj||obj.app!=='diario-sbd'||!obj.data||typeof obj.data!=='object'){toast('Questo file non è un backup del Diario SBD');return}
  const raw=S.rawDb;if(!raw){toast('Dati non disponibili');return}
  const loc=syncSnapshot();const m=lsGet('sbd:synced',{});let add=0,upd=0,del=0,keep=0;const okId=/^[A-Za-z0-9_\-.~:@+]{1,200}$/;
  S.importing=true;setStatus('Importazione in corso…');
  try{
    for(const c of SYNC_COLLS){const inc=obj.data[c]||{};for(const id in inc){const d=inc[id];if(!okId.test(id)||!d||typeof d!=='object'||Array.isArray(d))continue;const p=c+'/'+id;const im=d._mt||0;const tm=loc.tombs[p];
        if(tm!=null&&tm>=im){keep++;continue}
        const l=loc.data[c][id];
        if(!l){await raw.doc(p).set(d);add++;m[p]=im}
        else{const lm=l._mt||0;if(im>lm){await raw.doc(p).set(d);upd++;m[p]=im}else if(im===lm){m[p]=Math.max(m[p]||0,im)}else keep++}}}
    for(const p in (obj.tombs||{})){const tm=+obj.tombs[p]||0;const [c,id]=p.split('/');if(!SYNC_COLLS.includes(c)||!id||!okId.test(id))continue;const l=loc.data[c]&&loc.data[c][id];
        if(l&&(l._mt||0)<=tm){await raw.doc(p).delete();del++}
        if(!(loc.tombs[p]>=tm))await raw.doc('_tomb/'+tombId(p)).set({p,_mt:tm});m['~'+p]=Math.max(m['~'+p]||0,tm)}
  }catch(e){lsSet('sbd:synced',m);S.importing=false;updateStatus();toast('Importazione interrotta: '+(e&&e.code||'errore')+'. Riprova: quello già importato resta.');return}
  lsSet('sbd:synced',m);lsSet('sbd:lastImport',Date.now());S.importing=false;
  const pl=(n,a,b)=>n+' '+(n===1?a:b);const parts=[];if(add)parts.push(pl(add,'elemento nuovo','elementi nuovi'));if(upd)parts.push(pl(upd,'aggiornato','aggiornati'));if(del)parts.push(pl(del,'eliminato','eliminati'));
  S.syncMsg=(parts.length?'Importazione fatta: '+parts.join(', '):'Niente di nuovo da importare')+(keep?' · '+keep+' già più recenti qui, tenuti':'')+' · file del '+(obj.exportedAt?new Date(obj.exportedAt).toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'}):'?')+(obj.from?' ('+obj.from+')':'');
  toast(parts.length?'Importazione completata':'Niente di nuovo da importare');S.sel.coach=null;updateStatus();render()}
async function syncImportText(txt){let obj;try{obj=JSON.parse(String(txt||'').trim())}catch(e){toast('Il testo non è un backup valido');return}await syncImport(obj)}
function syncSection(){const pl=pendingList();const lastE=lsGet('sbd:lastExport',0),lastI=lsGet('sbd:lastImport',0);
  let h='<h2 id="sync">Sincronizza telefono e claude.ai</h2>';
  h+=OFF?'<p class="small muted">Questa è la versione offline sul telefono: tutto quello che registri resta salvato qui, anche senza internet. A casa tocca <b>Esporta</b> e carica il file nell\'app su claude.ai (Impostazioni › Importa), oppure mettilo nella cartella Palestra e chiedi a Claude di sincronizzare. Le nuove schede del coach fanno il giro inverso: Esporta da claude.ai e Importa qui.</p>'
    :'<p class="small muted">Qui carichi il file esportato dal telefono (versione offline). Per portare sul telefono le nuove schede del coach o le sedute registrate qui, tocca <b>Esporta</b> e importa il file nella versione offline. Non si perde niente: per ogni elemento vince la versione modificata per ultima.</p>';
  h+='<div class="tiles"><div class="tile"><div class="l">Da esportare</div><div class="v num">'+pl.length+'</div><div class="s">'+esc(pendingText(pl))+'</div></div><div class="tile"><div class="l">Ultima esportazione</div><div class="v num" style="font-size:22px">'+esc(agoText(lastE))+'</div><div class="s">ultima importazione: '+esc(agoText(lastI))+'</div></div></div>';
  if(S.syncMsg)h+='<div class="banner ok">'+esc(S.syncMsg)+'</div>';
  if(!ro()){h+='<div class="row">'+(OFF&&navigator.canShare?'<button class="btn" data-act="sync-share">Esporta e condividi</button><button class="btn ghost" data-act="sync-save">Salva file</button>':'<button class="btn" data-act="sync-save">Esporta (scarica file)</button>')+'<button class="btn ghost" data-act="sync-pick">Importa file</button><input type="file" id="sync-file" accept=".json,application/json,text/plain" hidden></div>';
    h+=(OFF&&navigator.canShare?'<p class="small muted">"Esporta e condividi" apre il menu di Android: scegli Drive, WhatsApp (a te stesso) o Gmail.</p>':'')+'<details><summary>Non riesci a scegliere il file?</summary><p class="small muted">Apri il file .json con un editor di testo, copia tutto e incollalo qui.</p><textarea id="sync-paste" placeholder="{&quot;app&quot;:&quot;diario-sbd&quot;, …}"></textarea><div class="row" style="margin-top:8px"><button class="btn ghost sm" data-act="sync-paste-go">Importa il testo</button></div></details>'}
  return h}

/* ---------- db ---------- */
async function boot(){
  render();
  const C=window.claude;const [db,user]=C&&C.use?await Promise.all([C.use('db'),C.use('user')]):[null,null];
  S.rawDb=db;S.db=db?wrapDb(db):null;S.user=user;if(C&&C.use)C.use('downloads').then(d=>{S.dl=d;if(S.view==='coach')scheduleRender()}).catch(()=>{});
  if(user){const c=await user.can('data.write');S.canWrite=c;}
  if(!db){S.ready=true;S.canWrite=false;setStatus('Dati non disponibili in questa vista');render();return}
  db.doc('config/settings').onSnapshot(s=>{const d=s.exists?s.data():{};S.rawSettings=clone(d);S.settings=Object.assign(clone(DEFAULTS),clone(d));for(const k of ['e1rm','e1rmWeek','rate'])S.settings[k]=Object.assign(clone(DEFAULTS[k]),d[k]?clone(d[k]):{});S.loaded.s=true;settle()},onErr);
  db.collection('logs').orderBy('ts','desc').limit(1000).onSnapshot(q=>{S.logs=q.docs.map(d=>Object.assign({id:d.id},clone(d.data())));S.loaded.l=true;settle()},onErr);
  db.collection('coachweeks').orderBy('order','asc').onSnapshot(q=>{S.coach=q.docs.map(d=>Object.assign({id:d.id},clone(d.data())));S.loaded.c=true;settle()},onErr);
  db.collection('days').onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=clone(d.data()));S.days=o;S.loaded.d=true;settle()},onErr);
  db.collection('mobtests').onSnapshot(q=>{S.mob=q.docs.map(d=>Object.assign({id:d.id},clone(d.data()))).sort((a,b)=>b.id.localeCompare(a.id));S.loaded.m=true;settle()},onErr);
  db.collection('_tomb').onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=clone(d.data()));S.tombs=o;if(S.ready)updateStatus()},()=>{});
}
function onErr(e){setStatus('Errore di collegamento ai dati: '+(e&&e.code||'sconosciuto'))}
function settle(){if(!S.ready&&Object.values(S.loaded).every(Boolean)){S.ready=true;if(!S.track)S.track=CLAUDE_PROGRAM?(S.settings.track||'claude'):'coach'}if(S.ready)scheduleRender();updateStatus()}
function updateStatus(){if(!S.ready||S.importing)return;const pn=pendingList().length;const ro=S.canWrite===false;const n=S.logs.length;setStatus((OFF?'<b>Telefono</b> · ':'')+(ro?'<b>Sola lettura</b> · ':'')+n+' sedute registrate'+(pn?' · <b>'+pn+' da esportare</b>':''))}
function setStatus(h){document.getElementById('status').innerHTML=h}
function ro(){return S.canWrite===false}
async function write(fn,okMsg){if(ro()){toast('Non hai i permessi per modificare');return false}try{await fn();if(okMsg)toast(okMsg);return true}catch(e){if(e&&e.code==='invalid_argument'&&S.canWrite==null){S.canWrite=false;render()}toast('Salvataggio non riuscito: '+(e&&e.code||'errore'));return false}}
function scheduleRender(){const a=document.activeElement;if(a&&a.closest&&a.closest('#main')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){S.pending=true;return}render()}
document.addEventListener('focusout',()=>{setTimeout(()=>{if(S.pending){const a=document.activeElement;if(!(a&&a.closest&&a.closest('#main')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){S.pending=false;render()}}},250)});
let toastT=null;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ---------- render ---------- */
function render(){const m=document.getElementById('main');document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===S.view?'page':'false'));
  if(!S.ready){m.innerHTML='<div class="empty">Sto caricando il diario…</div>';return}
  const v={oggi:vOggi,cal:vCal,prog:vProg,prog2:vProgress,corpo:vCorpo,mob:vMob,coach:vExport,set:vSet}[S.view];m.innerHTML=v();document.getElementById('timer').hidden=S.view!=='oggi'||ro()}

function vOggi(){const t=CLAUDE_PROGRAM?(S.track||'claude'):'coach';let h=CLAUDE_PROGRAM?'<div class="row" style="margin-top:14px"><div class="seg" role="group" aria-label="Scheda">'+
  '<button data-act="track" data-v="claude" aria-pressed="'+(t==='claude')+'">Programma Claude</button><button data-act="track" data-v="coach" aria-pressed="'+(t==='coach')+'">Scheda coach</button></div></div>':'';
  const anyLast=S.logs.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
  if(anyLast){const gap=daysBetween(anyLast.date,today());if(gap>=5){let rule=gap<=9?'Riprendi dalla seduta successiva: top set mezzo punto di RPE più basso, back-off −5%.':gap<=14?'Ripeti l\'ultima settimana completa.':'Fai una settimana con i carichi della sett. 6 (scarico), poi ripeti l\'ultima settimana completa.';h+='<div class="banner"><b>'+gap+' giorni dall\'ultima seduta.</b> '+rule+' Se abbassi i carichi, segnalo a fine seduta.</div>'}}
  if(OFF&&!S.logs.length&&!S.coach.length)h+='<div class="banner info"><b>Diario vuoto.</b> Per iniziare carica il file con i dati esportati da claude.ai. <button class="btn sm" data-act="gosync">Vai a Importa</button></div>';
  if(ro())h+='<div class="banner info">Stai guardando il diario in sola lettura. Gli allenamenti li registra Luca.</div>';
  return h+(t==='claude'?vClaudeSession():vCoachSession())}

function vClaudeSession(){if(!S.sel.claude)S.sel.claude=nextClaude();const {w,s}=S.sel.claude;
  let h='<div class="row" style="margin-top:12px;gap:10px"><label class="f">Settimana<select data-act="selw">'+Array.from({length:13},(_,i)=>i+1).map(x=>'<option value="'+x+'"'+(x===w?' selected':'')+'>Sett. '+x+' · '+blockOf(x)+'</option>').join('')+'</select></label>'+
  '<div class="chips" role="group" aria-label="Seduta">'+sessionsOf(w).map(x=>'<button class="chip'+(isDone('claude',w,x)?' done':'')+'" data-act="sels" data-v="'+x+'" aria-pressed="'+(x===s)+'" title="'+(isDone('claude',w,x)?'Già registrata':'')+'">'+x+'</button>').join('')+'</div></div>';
  const nx=nextClaude();if(nx.w!==w||nx.s!==s)h+='<p class="small muted">Prossima in sequenza: sett. '+nx.w+' · seduta '+nx.s+' <button class="btn ghost sm" data-act="gonext">Vai</button></p>';
  h+='<div class="sess-head"><div class="kicker">Sett. '+w+' · '+blockOf(w)+(isDone('claude',w,s)?' · già registrata':'')+'</div><h2>Seduta '+s+' – '+esc(SESS_TITLE[s])+'</h2></div>';
  h+=warmupBlock();
  if(w===6)h+='<p class="small muted">Scarico: tutti i complementari 2 serie @7.</p>';
  if(w===12)h+='<p class="small muted">Taper: la D si salta. La C va fatta 3-4 giorni prima del test.</p>';
  const k=dkey('claude',w,s);let d=loadDraft(k);if(!d){d=buildClaudeDraft(w,s);S.drafts[k]=d}
  h+=formBlock(k,d,{canAddD:s==='C'&&w<=11});return h}

function vCoachSession(){if(!S.coach.length)return '<div class="empty">Nessuna scheda del coach inserita.<br>Vai in <b>Programma › Scheda coach</b> e incolla la sua programmazione.</div>';
  if(!S.sel.coach||!coachSession(S.sel.coach.wid,S.sel.coach.sid))S.sel.coach=nextCoach();if(!S.sel.coach)return '<div class="empty">Le settimane del coach non hanno ancora sedute.<br>Aggiungile in <b>Programma › Scheda coach</b>.</div>';const {wid,sid}=S.sel.coach;const cs=coachSession(wid,sid);if(!cs)return '<div class="empty">Seduta non trovata.</div>';
  let h='<div class="row" style="margin-top:12px;gap:10px"><label class="f">Settimana<select data-act="selcw">'+S.coach.map(x=>'<option value="'+esc(x.id)+'"'+(x.id===wid?' selected':'')+'>'+esc(x.title||'Settimana')+'</option>').join('')+'</select></label>'+
  '<div class="chips">'+(cs.w.sessions||[]).map(x=>'<button class="chip'+(isDone('coach',wid,x.id)?' done':'')+'" data-act="selcs" data-v="'+esc(x.id)+'" aria-pressed="'+(x.id===sid)+'">'+esc(x.title||'?')+'</button>').join('')+'</div></div>';
  h+='<div class="sess-head"><div class="kicker">Scheda coach · '+esc(cs.w.title||'')+(isDone('coach',wid,sid)?' · già registrata':'')+'</div><h2>'+esc(cs.s.title||'Seduta')+'</h2></div>';
  h+=warmupBlock();
  if(cs.s.text)h+='<details><summary>Testo originale del coach</summary><p class="small" style="white-space:pre-wrap">'+esc(cs.s.text)+'</p></details>';
  const k=dkey('coach',wid,sid);let d=loadDraft(k);if(!d){d=buildCoachDraft(wid,sid);S.drafts[k]=d}
  h+=formBlock(k,d,{});return h}

function warmupBlock(){return '<details open class="pre"><summary>Pre-seduta (dal coach)</summary><ul class="plain">'+WARMUP.map(x=>'<li>'+esc(x[0])+' <span class="muted">· '+esc(x[1])+'</span></li>').join('')+'</ul><p class="small muted">Prima di ogni alzata principale trovi anche la mobilità specifica.</p></details>'}

function warmHtml(k,ex,i,dis){const nd=ex.warm.filter(w=>w.done).length;return '<details class="warmd" data-k="'+k+'" data-wopen="'+i+'"'+(ex.warmOpen?' open':'')+'><summary>Serie di avvicinamento <span class="muted small">'+nd+'/'+ex.warm.length+' fatte</span></summary><div class="sets warm"><span class="hd">#</span><span class="hd">Kg</span><span class="hd">Rip</span><span class="hd">Fatta</span>'+
        ex.warm.map((w,j)=>'<span class="lb">'+(j+1)+'</span><input inputmode="decimal" aria-label="Kg avvicinamento '+(j+1)+'" data-k="'+k+'" data-i="'+i+'" data-j="'+j+'" data-w="1" data-f="kg" value="'+esc(w.kg)+'"'+dis+'><input inputmode="numeric" aria-label="Ripetizioni avvicinamento '+(j+1)+'" data-k="'+k+'" data-i="'+i+'" data-j="'+j+'" data-w="1" data-f="reps" value="'+esc(w.reps)+'"'+dis+'><button class="ck" data-act="wdone" data-k="'+k+'" data-i="'+i+'" data-j="'+j+'" aria-pressed="'+(!!w.done)+'" aria-label="Avvicinamento fatto"'+dis+'>✓</button>').join('')+'</div>'+
        (ro()?'':'<div class="row" style="margin-top:6px"><button class="btn ghost sm" data-act="addwarm" data-k="'+k+'" data-i="'+i+'">+ serie</button>'+(ex.warm.length?'<button class="btn ghost sm" data-act="delwarm" data-k="'+k+'" data-i="'+i+'">− serie</button>':'')+'</div>')+'</details>'}
function formBlock(k,d,opt){const dis=ro()?' disabled':'';let h='';
  const seenPrep={};d.ex.forEach((ex,i)=>{const L=ex.lift||'';const top=ex.sets.find(s=>s.role==='top');const pk=prepKind(ex);if(pk&&!seenPrep[pk]){seenPrep[pk]=1;h+=prepBox(pk)}
    h+='<div class="ex'+(L?' lift-'+L:'')+'"><div class="ex-h"><b>'+esc(ex.name)+'</b>'+(L&&ex.comp?'<span class="tag '+L+'">conta per il massimale</span>':'')+'</div><div class="presc">'+esc(ex.presc)+'</div>';
    if(ex.main||ex.lift){const ws=(top||ex.sets[0]||{});const tk=num(ws.kg);h+='<div class="plates" data-pl="'+i+'">'+(tk?plates(tk):'')+'</div>';
      if(!ex.warm)ex.warm=warmFor(tk,num(ws.reps));h+=warmHtml(k,ex,i,dis)}
    h+='<div class="sets"><span class="hd">Serie</span><span class="hd" style="text-align:center">Kg teorici</span><span class="hd">Kg effettivi</span><span class="hd">Rip</span><span class="hd">RPE</span><span class="hd">Fatta</span>';
    ex.sets.forEach((s,j)=>{const pk=s.plan&&s.plan.kg;h+='<span class="lb">'+esc(s.label||(j+1))+'</span>'+'<span class="th'+(pk&&num(s.kg)!=null&&Math.abs(num(s.kg)-pk)>=0.01?' off':'')+'" data-th="'+i+'-'+j+'">'+(pk?fmt(pk):'–')+'</span>'+
      '<input inputmode="decimal" aria-label="Kg effettivi serie '+(j+1)+'" data-k="'+k+'" data-i="'+i+'" data-j="'+j+'" data-f="kg" value="'+esc(s.kg)+'"'+dis+'>'+
      '<input inputmode="numeric" aria-label="Ripetizioni serie '+(j+1)+'" data-k="'+k+'" data-i="'+i+'" data-j="'+j+'" data-f="reps" value="'+esc(s.reps)+'"'+dis+'>'+
      '<input inputmode="decimal" aria-label="RPE serie '+(j+1)+'" placeholder="'+(s.target?'@'+fmt(s.target):'')+'" data-k="'+k+'" data-i="'+i+'" data-j="'+j+'" data-f="rpe" value="'+esc(s.rpe)+'"'+dis+'>'+
      '<button class="ck" data-act="done" data-k="'+k+'" data-i="'+i+'" data-j="'+j+'" aria-pressed="'+(!!s.done)+'" aria-label="Serie fatta"'+dis+'>✓</button>'});
    h+='</div>'+(ro()?'':'<div class="row" style="margin-top:6px"><button class="btn ghost sm" data-act="addset" data-k="'+k+'" data-i="'+i+'">+ serie</button>'+(ex.sets.length>1?'<button class="btn ghost sm" data-act="delset" data-k="'+k+'" data-i="'+i+'">− serie</button>':'')+'</div>')+'</div>'});
  if(opt.canAddD&&!ro()&&!d.ex.some(e=>e.fromD))h+='<p class="small muted">Questa settimana non riesci a fare la D? <button class="btn ghost sm" data-act="addD" data-k="'+k+'">Aggiungi qui la variante panca della D</button></p>';
  h+='<div id="endblock">'+endBlock(k,d)+'</div>';
  const pc=d.elbow>=6?'p2':d.elbow>=4?'p1':'p0';
  h+='<div class="ex"><div class="grid2"><label class="f">Data<input type="date" data-k="'+k+'" data-f="date" value="'+esc(d.date)+'"'+dis+'></label>'+
    '<label class="f">Dolore al braccio <span class="pain '+pc+'" id="painv">'+d.elbow+'/10</span><input type="range" min="0" max="10" step="1" data-k="'+k+'" data-f="elbow" value="'+d.elbow+'"'+dis+'></label></div>'+
    '<label class="f" style="margin-top:8px">Note<textarea data-k="'+k+'" data-f="notes" placeholder="Come ti sei sentito, sonno, cibo, tecnica…"'+dis+'>'+esc(d.notes)+'</textarea></label>'+
    (d.elbow>=4?'<p class="small" style="color:var(--warn)">'+(d.elbow>=6?'Dolore 6+: per 1 settimana squat solo high bar e rinforzo solo isometrico.':'Dolore 4-5: nella prossima seduta niente presa stretta (Larsen al suo posto), niente tricipiti sopra la testa, squat della C high bar.')+'</p>':'')+'</div>';
  if(!ro())h+='<div class="save-bar"><button class="btn" data-act="save" data-k="'+k+'">Salva seduta</button><button class="btn ghost" data-act="reset" data-k="'+k+'">Azzera</button></div>';
  return h}


/* ---------- Calendario ---------- */
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const GIORNI=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
function isoUTC(t){return new Date(t).toISOString().slice(0,10)}
function longDate(iso){const t=dms(iso);const d=new Date(t);return GIORNI.at(d.getUTCDay())+' '+d.getUTCDate()+' '+MESI.at(d.getUTCMonth())}
function vCal(){const m=S.calMonth||today().slice(0,7);const [y,mo]=m.split('-').map(Number);const first=Date.UTC(y,mo-1,1);const startDow=(new Date(first).getUTCDay()+6)%7;const nDays=new Date(Date.UTC(y,mo,0)).getUTCDate();const td=today();const sel=S.calSel||td;
  const byDate={};for(const l of S.logs){if(l.date)(byDate[l.date]=byDate[l.date]||[]).push(l)}
  const inMonth=S.logs.filter(l=>(l.date||'').startsWith(m)).length;const from28=dms(td)-27*864e5;const last28=S.logs.filter(l=>l.date&&dms(l.date)>=from28&&dms(l.date)<=dms(td)).length;
  const planned=Object.keys(S.days).filter(k=>S.days[k].plan&&k>=td&&!byDate[k]).sort().slice(0,4);
  let h='<div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn ghost sm" data-act="calnav" data-v="-1" aria-label="Mese precedente">‹</button><h2 style="margin:0">'+MESI.at(mo-1)+' '+y+'</h2><button class="btn ghost sm" data-act="calnav" data-v="1" aria-label="Mese successivo">›</button></div>';
  h+='<p class="small muted" style="text-align:center">'+inMonth+' sedute in questo mese · '+fmt(last28/4)+' a settimana nelle ultime 4 settimane'+(m!==td.slice(0,7)?' · <button class="btn ghost sm" data-act="caltoday">Oggi</button>':'')+'</p>';
  h+='<div class="cal">'+['L','M','M','G','V','S','D'].map(x=>'<div class="dh">'+x+'</div>').join('');
  for(let i=0;i<startDow;i++)h+='<div class="pad"></div>';
  for(let dd=1;dd<=nDays;dd++){const iso=isoUTC(first+(dd-1)*864e5);const lg=byDate[iso]||[];const dy=S.days[iso]||{};const plan=dy.plan&&!lg.length;
    h+='<button class="day'+(plan?' plan':'')+(iso===td?' today':'')+(iso===sel?' sel':'')+'" data-act="calday" data-v="'+iso+'" aria-label="'+esc(longDate(iso))+(lg.length?', '+lg.length+' sedute':'')+(plan?', previsto':'')+'"><span class="n">'+dd+'</span><span class="cs">'+lg.map(l=>'<span class="c'+(l.track==='coach'?' coach':'')+'">'+(l.track==='coach'?esc(String(l.title||'').split(' ').at(-1).slice(0,3)||'Co'):esc(l.session||''))+'</span>').join('')+(plan?'<span class="c pl">'+(iso<td?'×':'prev.')+'</span>':'')+'</span>'+((dy.mobS||dy.mobL)?'<span class="mob" title="Mobilità fatta"></span>':'')+'</button>'}
  h+='</div><p class="small muted">'+(CLAUDE_PROGRAM?'Lettera = seduta del programma Claude · in blu = scheda coach':'Lettera = giorno della scheda del coach')+' · bordo tratteggiato = allenamento previsto · punto verde = mobilità fatta.</p>';
  const lg=(byDate[sel]||[]);const dy=S.days[sel]||{};
  h+='<div class="ex"><div class="ex-h"><b>'+esc(longDate(sel))+'</b>'+(ro()?'':'<button class="btn ghost sm" data-act="calplan" data-v="'+sel+'">'+(dy.plan?'Togli previsione':'Segna come allenamento previsto')+'</button>')+'</div>';
  if(lg.length)h+=lg.map(l=>'<div style="margin-top:8px"><div class="target">'+esc(l.title||'')+' <span class="pain '+((num(l.elbow)||0)>=6?'p2':(num(l.elbow)||0)>=4?'p1':'p0')+'">'+(num(l.elbow)||0)+'</span></div>'+(l.exercises||[]).filter(ex=>(ex.sets||[]).length).map(ex=>'<div class="small"><b>'+esc(ex.name)+'</b>: <span class="num">'+esc(groupSets(ex.sets))+'</span></div>').join('')+(l.notes?'<p class="small muted">'+esc(l.notes)+'</p>':'')+'</div>').join('');
  else h+='<p class="small muted">'+(dy.plan?(sel<td?'Era previsto un allenamento, ma non c\'è nessuna seduta registrata.':'Allenamento previsto.'):'Nessuna seduta registrata.')+'</p>';
  const extra=[];if(num(dy.bw))extra.push('peso '+fmt(dy.bw)+' kg');if(num(dy.kcal))extra.push(fmt(dy.kcal,0)+' kcal');if(num(dy.prot))extra.push(fmt(dy.prot,0)+' g proteine');if(dy.mobS)extra.push('mobilità breve');if(dy.mobL)extra.push('mobilità lunga');
  if(extra.length)h+='<p class="small">'+extra.join(' · ')+'</p>';h+='</div>';
  if(planned.length)h+='<h3>Prossimi allenamenti previsti</h3><ul class="plain">'+planned.map(k=>'<li>'+esc(longDate(k))+'</li>').join('')+'</ul>';
  return h}


/* ---------- fine seduta: scostamento dal teorico ed esercizi saltati ---------- */
function analyzeDraft(d){const dev=[],skipped=[];let pl=0,dl=0;for(const ex of d.ex){const planned=ex.planned||ex.sets.length;const done=ex.sets.filter(s=>s.done);
    if(done.length<planned)skipped.push({name:ex.name,presc:ex.presc||'',planned,done:done.length,main:!!ex.main||!!ex.lift});
    const pairs=done.filter(s=>s.plan&&s.plan.kg&&num(s.kg));if(!pairs.length)continue;
    const pk=pairs.reduce((a,s)=>a+s.plan.kg,0)/pairs.length,dk=pairs.reduce((a,s)=>a+num(s.kg),0)/pairs.length;
    const rp=pairs.reduce((a,s)=>a+(s.plan.reps||num(s.reps)||0),0),rd=pairs.reduce((a,s)=>a+(num(s.reps)||0),0);
    for(const s of pairs){const r=s.plan.reps||num(s.reps)||0;pl+=s.plan.kg*r;dl+=num(s.kg)*(num(s.reps)||0)}
    const pct=Math.round((dk-pk)/pk*1000)/10;if(Math.abs(dk-pk)>=0.01||rd<rp)dev.push({name:ex.name,plan:Math.round(pk*10)/10,done:Math.round(dk*10)/10,pct,rp,rd,main:!!ex.main||!!ex.lift})}
  const devTot=pl?Math.round((dl-pl)/pl*1000)/10:null;return {dev,skipped,devTot}}
function sgn(v){return (v>0?'+':'')+fmt(v)+'%'}
function devText(x){const parts=[];if(Math.abs(x.done-x.plan)>=0.01)parts.push(fmt(x.done)+' invece di '+fmt(x.plan)+' kg ('+sgn(x.pct)+')');if(x.rp!=null&&x.rd<x.rp)parts.push(x.rd+' ripetizioni su '+x.rp);return x.name+': '+(parts.join(', ')||'come da scheda')}
function refreshEnd(k){const el=document.getElementById('endblock');if(el&&S.drafts[k])el.innerHTML=endBlock(k,S.drafts[k])}
function devColor(v){return v==null?'var(--muted)':v<=-5?'var(--crit)':v<0?'var(--warn)':'var(--good)'}
function endBlock(k,d){const an=analyzeDraft(d);const anyDone=d.ex.some(e=>e.sets.some(s=>s.done));
  let h='<div class="ex"><div class="ex-h"><b>Fine seduta</b>'+(an.devTot!=null?'<span class="target num" style="color:'+devColor(an.devTot)+'">'+sgn(an.devTot)+' rispetto al teorico</span>':'')+'</div>';
  if(!anyDone)return h+'<p class="small muted">Spunta ✓ le serie fatte: qui vedi quanto ti scosti dai kg teorici e quali esercizi restano da fare.</p></div>';
  h+='<p class="small muted" style="margin-top:4px">Scostamento calcolato su kg × ripetizioni delle serie fatte, rispetto ai kg teorici.</p>';
  if(an.dev.length)h+='<ul class="plain small">'+an.dev.map(x=>'<li style="color:'+devColor(x.pct<0||x.rd<x.rp?-1:x.pct)+'">'+esc(devText(x))+'</li>').join('')+'</ul>';
  else h+='<p class="small">Tutto come da scheda.</p>';
  if(an.skipped.length)h+='<div class="small" style="margin-top:6px"><b>Verranno registrati come saltati</b>:<ul class="plain">'+an.skipped.map(x=>'<li>'+esc(x.name)+' <span class="muted">· '+(x.done?x.done+' serie su '+x.planned:'tutto')+'</span></li>').join('')+'</ul></div>';
  return h+'</div>'}
function devChart(W,logs){const pl=(logs||S.logs.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.ts||0)-(b.ts||0))).filter(l=>l.devTot!=null).slice(-24);if(!pl.length)return '';
  const H=170,mid=H/2-6,sc=Math.max(10,...pl.map(l=>Math.abs(l.devTot)));const k=(mid-14)/sc;const bw2=Math.min(26,(W-48)/pl.length-4);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Scostamento dal teorico per seduta"><line x1="40" x2="'+W+'" y1="'+mid+'" y2="'+mid+'" stroke="var(--line)"/><text x="34" y="'+(mid+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">0%</text><text x="34" y="'+(mid-sc*k+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">+'+fmt(sc,0)+'%</text><text x="34" y="'+(mid+sc*k+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">−'+fmt(sc,0)+'%</text>';
  pl.forEach((l,i)=>{const v=l.devTot;const x=44+i*((W-48)/pl.length);const hgt=Math.max(Math.abs(v)*k,1.5);s+='<rect x="'+x+'" y="'+(v>=0?mid-hgt:mid)+'" width="'+bw2+'" height="'+hgt+'" rx="3" fill="'+devColor(v)+'"><title>'+esc(dlabel(l.date)+' · '+(l.title||'')+': '+sgn(v))+'</title></rect>'});
  const d0=pl[0].date,d1=pl.at(-1).date;s+='<text x="44" y="'+(H-6)+'" font-size="11" fill="var(--muted)">'+dlabel(d0)+'</text><text x="'+(W-4)+'" y="'+(H-6)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+dlabel(d1)+'</text></svg>';
  const avg=pl.reduce((a,l)=>a+l.devTot,0)/pl.length;
  return '<h2>Scostamento dal teorico</h2><div class="chart">'+s+'<p class="small muted">Ogni barra è una seduta: kg × ripetizioni fatti rispetto ai kg teorici. Media delle ultime '+pl.length+': <b style="color:'+devColor(avg)+'">'+sgn(Math.round(avg*10)/10)+'</b>.</p></div>'}
function skipData(days){const from=days?dms(today())-(days-1)*864e5:-Infinity;const lg=S.logs.filter(l=>l.date&&dms(l.date)>=from).sort((a,b)=>(a.date||'').localeCompare(b.date||''));const by={};
  for(const l of lg)for(const x of (l.skipped||[])){const k=x.name;const o=by[k]||(by[k]={name:k,main:x.main,times:0,missing:0,dates:[],titles:[]});o.times++;o.missing+=x.planned-x.done;o.dates.push(l.date);o.titles.push((l.title||'')+(x.done?' ('+x.done+'/'+x.planned+')':' (saltato)'))}
  const under=lg.filter(l=>l.devTot!=null&&l.devTot<=-3);return {list:Object.values(by).sort((a,b)=>(b.main-a.main)||(b.missing-a.missing)),under,count:lg.length,lg}}
function skipReport(){const sd=skipData(S.skipDays);const st=S.settings;const L=['Riepilogo per sistemare il programma (Diario SBD) · '+(S.skipDays?'ultimi '+S.skipDays+' giorni':'tutto il ciclo')+' · '+sd.count+' sedute registrate'];

function parseCoach(text){const ex=[];for(const raw of String(text||'').split(/\r?\n/)){const line=raw.trim();if(!line)continue;if(/^\[?\d{1,2}\/\d{1,2}\/\d{2,4}/.test(line))continue;if(/^giorno\s*\d+\s*:?$/i.test(line))continue;const m=/^([^:]{2,60}):\s*(.*)$/.exec(line);if(m&&!/^\d/.test(m[1])){ex.push({name:m[1].trim(),presc:m[2].trim(),lift:guessLift(m[1])})}else if(ex.length){ex.at(-1).presc=(ex.at(-1).presc+' '+line).trim()}}return ex}
function guessLift(n){n=n.toLowerCase().trim();if(/^(sq|squat)\b/.test(n)&&!/goblet|cossa|bulgar|sissy|jump|front|high/.test(n))return 'SQ';if(/^(bp|panca)\b/.test(n)&&!/inclinat|manubr|larsen|stretta|spoto|floor|board|45|30/.test(n))return 'BP';if(/^(dl|stacco)\b/.test(n)&&!/rumeno|romanian|rdl|blocchi|regular|fermo/.test(n))return 'DL';return ''}

        '<p class="small muted">Con "Squat", "Panca" o "Stacco sumo" le serie con RPE di quell\'esercizio contano per il massimale stimato.</p><div class="row"><button class="btn sm" data-act="cs-save">Salva seduta</button><button class="btn ghost sm" data-act="cs-cancel">Annulla</button><button class="btn ghost sm" data-act="cs-del">Elimina seduta</button></div></div>'}

/* ---------- Carichi settimana per settimana (tabella + Excel) ---------- */
function normName(n){return String(n||'').toLowerCase().replace(/\s+/g,' ').trim()}
function topSet(sets){const all=(sets||[]).filter(s=>s);if(!all.length)return null;const ws=all.filter(s=>!s.bo&&num(s.kg));const pool=ws.length?ws:all.filter(s=>num(s.kg));
  if(!pool.length){const r=Math.max(0,...all.map(s=>num(s.reps)||0));return {kg:null,reps:r||null,rpe:''}}
  let b=pool[0];for(const s of pool)if(num(s.kg)>num(b.kg)||(num(s.kg)===num(b.kg)&&(num(s.reps)||0)>(num(b.reps)||0)))b=s;return {kg:num(b.kg),reps:num(b.reps),rpe:b.rpe}}
function progData(){const weeks=S.coach.filter(w=>(w.order||0)>=1).sort((a,b)=>(a.order||0)-(b.order||0));const rows=[],idx={};const key=(d,n)=>normName(d)+'|'+normName(n);
  const row=(day,name)=>{const k=key(day,name);if(!(k in idx)){idx[k]=rows.length;rows.push({day:day||'',name,cells:{}})}return rows[idx[k]]};
  for(const w of weeks)for(const s of (w.sessions||[]))for(const e of (s.exercises||[]))row(s.title,e.name).cells[w.id]={presc:e.presc||''};
  const lg=S.logs.filter(l=>l.track==='coach').sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.ts||0)-(b.ts||0));
  for(const l of lg){const w=weeks.find(x=>x.id===l.week);if(!w)continue;const s=(w.sessions||[]).find(x=>x.id===l.session);const day=s?s.title:'';
    for(const ex of (l.exercises||[])){const best=topSet(ex.sets);if(!best)continue;const r=row(day,ex.name);r.cells[w.id]=Object.assign(r.cells[w.id]||{},{best,date:l.date})}}
  rows.forEach((r,i)=>r.i=i);rows.sort((a,b)=>a.day.localeCompare(b.day,'it',{numeric:true})||a.i-b.i);return {weeks,rows}}
function cellTxt(b){if(!b)return '';if(b.kg!=null)return fmt(b.kg)+(b.reps?' × '+b.reps:'')+(b.rpe!==''&&b.rpe!=null?' @'+fmt(b.rpe):'');return b.reps?b.reps+' rip':'fatto'}
function progSection(){const pd=progData();let h='<h2>Carichi settimana per settimana</h2><p class="small muted">Kg della serie allenante di ogni esercizio (la più pesante, back-off esclusi), presi in automatico dalle sedute salvate. Una colonna per settimana del coach; la settimana 0 non è inclusa.</p>';
  if(!pd.weeks.length)return h+'<div class="empty">Nessuna settimana del coach da confrontare.</div>';
  h+='<div class="tbl"><table><thead><tr><th>Esercizio</th>'+pd.weeks.map(w=>'<th>'+esc(w.title||'')+'</th>').join('')+'</tr></thead><tbody>';let day=null;
  for(const r of pd.rows){if(r.day!==day){day=r.day;h+='<tr><td colspan="'+(pd.weeks.length+1)+'" style="background:var(--sunk);font-weight:600">'+esc(day||'Altro')+'</td></tr>'}
    let prev=null;h+='<tr><td>'+esc(r.name)+'</td>'+pd.weeks.map(w=>{const c=r.cells[w.id];let t;if(!c)t='<span class="muted">—</span>';else if(!c.best)t='<span class="muted" title="'+esc(c.presc||'')+'">da fare</span>';else{const b=c.best;let d='';if(prev&&prev.kg!=null&&b.kg!=null&&Math.abs(b.kg-prev.kg)>=0.01){const x=b.kg-prev.kg;d=' <span class="small" style="color:'+(x>0?'var(--good)':'var(--crit)')+'">'+(x>0?'+':'−')+fmt(Math.abs(x))+'</span>'}t='<b class="num">'+esc(cellTxt(b))+'</b>'+d}if(c&&c.best)prev=c.best;return '<td class="k">'+t+'</td>'}).join('')+'</tr>'}
  h+='</tbody></table></div>';
  h+=S.dl?'<div class="row"><button class="btn ghost sm" data-act="xlsx">Scarica Excel</button><span class="small muted">Stessa tabella, già aggiornata: un foglio con i kg e uno con kg × ripetizioni @RPE.</span></div>':'';
  return h}
function xesc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'')}
function colL(n){let s='';n++;while(n){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
function sheetXml(grid,widths){const rows=grid.map((r,ri)=>'<row r="'+(ri+1)+'">'+r.map((c,ci)=>{if(c==null||c.v==null||c.v==='')return c&&c.s?'<c r="'+colL(ci)+(ri+1)+'" s="'+c.s+'"/>':'';const ref=colL(ci)+(ri+1);const st=c.s?' s="'+c.s+'"':'';return typeof c.v==='number'?'<c r="'+ref+'"'+st+'><v>'+c.v+'</v></c>':'<c r="'+ref+'"'+st+' t="inlineStr"><is><t xml:space="preserve">'+xesc(c.v)+'</t></is></c>'}).join('')+'</row>').join('');

function chartW(){const m=document.getElementById('main');const w=m&&m.clientWidth?m.clientWidth-56:640;return Math.max(300,Math.min(700,w))}
function lineChart(series,opt){const W=opt.W||chartW(),H=opt.h||240,L=44,R=16,T=14,B=28;const pts=series.flatMap(s=>s.points);if(!pts.length)return '<div class="empty">'+esc(opt.empty||'Ancora nessun dato.')+'</div>';
  let x0=Math.min(...pts.map(p=>p.x)),x1=Math.max(...pts.map(p=>p.x));if(x1===x0){x0-=3*864e5;x1+=3*864e5}
  const ys=pts.map(p=>p.y).concat((opt.refs||[]).map(r=>r.y));let y0=Math.min(...ys),y1=Math.max(...ys);const pad=Math.max((y1-y0)*.12,opt.minPad||2);y0=Math.floor((y0-pad)/(opt.step||5))*(opt.step||5);y1=Math.ceil((y1+pad)/(opt.step||5))*(opt.step||5);
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);const st=opt.step||5;const ticks=[];const nT=Math.round((y1-y0)/st);const every=Math.max(1,Math.ceil(nT/5));for(let v=y0,i=0;v<=y1+1e-6;v+=st,i++)if(i%every===0)ticks.push(v);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.title||'Grafico')+'">';
  s+=ticks.map(v=>'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+fmt(v)+'</text>').join('');
  const dt=[x0,(x0+x1)/2,x1];s+=dt.map((x,i)=>{const d=new Date(x);return '<text x="'+X(x)+'" y="'+(H-8)+'" text-anchor="'+(i===0?'start':i===2?'end':'middle')+'" font-size="11" fill="var(--muted)">'+String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'</text>'}).join('');
  for(const r of (opt.refs||[]))s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(r.y)+'" y2="'+Y(r.y)+'" stroke="'+r.color+'" stroke-dasharray="5 4" stroke-width="1.2"/><text x="'+(W-R)+'" y="'+(Y(r.y)-5)+'" text-anchor="end" font-size="11" fill="'+r.color+'">'+esc(r.label)+'</text>';
  for(const se of series){const p=se.points.slice().sort((a,b)=>a.x-b.x);if(se.line!==false&&p.length>1)s+='<path d="'+p.map((q,i)=>(i?'L':'M')+X(q.x).toFixed(1)+' '+Y(q.y).toFixed(1)).join('')+'" fill="none" stroke="'+se.color+'" stroke-width="'+(se.w||2)+'"'+(se.dash?' stroke-dasharray="'+se.dash+'"':'')+'/>';
    if(se.dots!==false)s+=p.map((q,i)=>'<circle cx="'+X(q.x).toFixed(1)+'" cy="'+Y(q.y).toFixed(1)+'" r="'+(i===p.length-1?4.5:3)+'" fill="'+se.color+'"'+(se.fade?' fill-opacity=".45"':'')+'><title>'+esc((se.name||'')+' '+dlabel(q.date||'')+': '+fmt(q.y)+(opt.unit||''))+'</title></circle>').join('');

function elbowChart(W,logs){const pl=(logs||S.logs.slice().sort((a,b)=>(a.ts||0)-(b.ts||0))).filter(l=>l.elbow!=null).slice(-24);if(!pl.length)return '';const H=130,bw2=Math.min(26,(W-40)/pl.length-4);

function periodLogs(days){const from=days?dms(today())-(days-1)*864e5:-Infinity;return S.logs.filter(l=>l.date&&dms(l.date)>=from).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.ts||0)-(b.ts||0))}
function groupSets(sets){const out=[];let prev=null,n=0;const flush=()=>{if(!prev)return;const kg=num(prev.kg),r=prev.reps,e=prev.rpe;let t=(n>1?n+'×':'')+(r==null||r===''?'?':r)+(kg?' a '+fmt(kg):'')+(e!==''&&e!=null?' @'+fmt(e):'');out.push(t)};for(const s of (sets||[])){const k=s.kg+'|'+s.reps+'|'+s.rpe;if(prev&&k===prev.k){n++}else{flush();prev=Object.assign({k},s);n=1}}flush();return out.join(' · ')}
function periodLabel(days){const lg=periodLogs(days);const a=days?dlabel(new Date(dms(today())-(days-1)*864e5).toISOString().slice(0,10)):(lg[0]?dlabel(lg[0].date):'');return (a?a+' – ':'')+dlabel(today())}
function mobCount(days){const n=days||7;let b=0,l=0;for(let i=0;i<n;i++){const k=new Date(dms(today())-i*864e5).toISOString().slice(0,10);if(S.days[k]&&S.days[k].mobS)b++;if(S.days[k]&&S.days[k].mobL)l++}return {b,l,n}}
function e1Line(sep){return ['SQ','BP','DL'].map(L=>{const c=e1Current(L);return LIFT_NAME[L]+' '+fmt(c?r25(c):num(S.settings.e1rm[L]))+(c?'':' (impostato)')}).join(sep)}
function waText(days){const lg=periodLogs(days);const a0=weekAvg(0),a1=weekAvg(1);const mc=mobCount(days&&days<=28?days:7);const L=[];
  L.push('*Diario SBD – Luca*');L.push('Periodo: '+periodLabel(days)+' · '+lg.length+' sedute');
  if(a0)L.push('Peso medio 7 gg: '+fmt(a0)+' kg'+(a1?' (settimana prima '+fmt(a1)+')':''));
  L.push('Massimali stimati: '+e1Line(' · '));
  L.push('Mobilità: breve '+mc.b+'/'+mc.n+' · lunga '+mc.l);
  for(const l of lg){L.push('');L.push('*'+dlabel(l.date)+' · '+(l.title||'')+'*');L.push('Dolore al braccio '+(num(l.elbow)||0)+'/10'+(l.devTot!=null?' · rispetto al teorico '+sgn(l.devTot):''));if((l.dev||[]).length)L.push('Scostamenti: '+l.dev.map(devText).join('; '));
    for(const ex of (l.exercises||[]))if((ex.sets||[]).length)L.push('- '+ex.name+': '+groupSets(ex.sets));
    if((l.skipped||[]).length)L.push('Saltati: '+l.skipped.map(x=>x.name+(x.done?' ('+x.done+'/'+x.planned+')':'')).join(', '));
    if(l.notes)L.push('_Note:_ '+String(l.notes).replace(/\s+/g,' ').trim())}
  if(!lg.length){L.push('');L.push('Nessuna seduta registrata in questo periodo.')}
  return L.join('\n')}
function exportHtml(days){const lg=periodLogs(days);const css=(document.querySelector('style')||{}).textContent||'';const st=S.settings;const cur={};for(const L of ['SQ','BP','DL'])cur[L]=e1Current(L);
  const bw=latestBW();const tot=['SQ','BP','DL'].reduce((s,L)=>s+(cur[L]||num(st.e1rm[L])),0);const dt=dots(tot,bw);const ser=e1Series();const cols={SQ:'var(--sq)',BP:'var(--bp)',DL:'var(--dl)'};
  let b='<div class="wrap" style="padding-block:16px 40px"><div class="brand"><h1>Diario <span>SBD</span> · Luca</h1><div class="status">Esportato il '+dlabel(today())+' · periodo '+esc(periodLabel(days))+'</div></div>';
  b+='<p class="small muted">Copia in sola lettura. I dati aggiornati sono nell\'app di Luca: questo file mostra la situazione al momento dell\'esportazione.</p>';
  b+='<h2>Massimali stimati</h2><div class="tiles">'+['SQ','BP','DL'].map(L=>'<div class="tile '+L+'"><div class="l">'+LIFT_NAME[L]+'</div><div class="v num">'+fmt(cur[L]?r25(cur[L]):num(st.e1rm[L]))+'</div><div class="s">'+(cur[L]?'dai log':'impostato')+'</div></div>').join('')+'<div class="tile"><div class="l">Totale · DOTS</div><div class="v num">'+fmt(r25(tot))+'</div><div class="s">'+(dt?'DOTS '+fmt(dt)+' a '+fmt(bw)+' kg':'')+'</div></div></div>';
  b+='<div class="chart">'+lineChart(['SQ','BP','DL'].map(L=>({name:LIFT_NAME[L],color:cols[L],points:ser[L]})),{W:480,title:'Massimale stimato per alzata',unit:' kg',h:260,step:10,empty:'Ancora nessuna seduta con RPE.'})+'<div class="row small" style="gap:14px;margin-top:4px"><span class="tag SQ">Squat</span><span class="tag BP">Panca</span><span class="tag DL">Stacco sumo</span><span class="muted">Massimali 2025: 190 / 120 / 190</span></div></div>';
  const dk=Object.keys(S.days).filter(k=>num(S.days[k].bw)).sort();const bp=dk.map(k=>({x:dms(k),y:num(S.days[k].bw),date:k}));const av=bp.map(p=>{const w=bp.filter(q=>q.x<=p.x&&q.x>p.x-7*864e5);return {x:p.x,y:w.reduce((s,q)=>s+q.y,0)/w.length,date:p.date}});
  b+='<h2>Peso corporeo</h2><div class="chart">'+lineChart([{name:'Peso',color:'var(--muted)',points:bp,line:false,fade:true},{name:'Media 7 giorni',color:'var(--ink)',points:av,dots:false,w:2.2}],{W:480,title:'Peso corporeo',unit:' kg',step:1,minPad:.5,refs:num(st.bwTarget)?[{y:num(st.bwTarget),label:'obiettivo '+fmt(st.bwTarget),color:'var(--good)'}]:[],empty:'Nessun peso registrato.'})+'</div>';
  b+=elbowChart(480);b+=devChart(480);
  if(!CLAUDE_PROGRAM){const nc=nextCoach();const cs=nc&&coachSession(nc.wid,nc.sid);if(cs)b+='<h2>Prossima seduta · '+esc((cs.w.title||'')+' · '+(cs.s.title||''))+'</h2><div class="tbl"><table><thead><tr><th>Esercizio</th><th>Prescrizione</th></tr></thead><tbody>'+(cs.s.exercises||[]).map(e=>'<tr><td>'+esc(e.name)+'</td><td>'+esc(e.presc)+'</td></tr>').join('')+'</tbody></table></div>'}
  else{const nx=nextClaude();b+='<h2>Programma · settimana '+nx.w+' ('+blockOf(nx.w)+')</h2>';
  if(nx.w<13){b+='<div class="tbl"><table><thead><tr><th>Seduta</th><th>Alzata</th><th>Schema</th></tr></thead><tbody>'+(TPL[nx.w]||[]).map(it=>'<tr><td>'+it.s+'</td><td>'+esc(it.n)+'</td><td class="k">'+esc(itemText(it,nx.w))+'</td></tr>').join('')+'</tbody></table></div><p class="small muted">Prossima seduta in sequenza: '+nx.s+'. Massimali di lavoro: squat '+fmt(st.e1rm.SQ)+', panca '+fmt(st.e1rm.BP)+', sumo '+fmt(st.e1rm.DL)+'.</p>'}else b+='<p>Settimana del test dei massimali.</p>'}
  b+='<h2>Sedute del periodo ('+lg.length+')</h2>'+(lg.length?'':'<div class="empty">Nessuna seduta nel periodo.</div>');
  for(const l of lg.slice().reverse()){const v=num(l.elbow)||0;b+='<div class="ex"><div class="ex-h"><b>'+dlabel(l.date)+' · '+esc(l.title||'')+'</b><span class="pain '+(v>=6?'p2':v>=4?'p1':'p0')+'">braccio '+v+'</span></div>'+(l.exercises||[]).map(ex=>'<div class="small" style="margin:3px 0"><b>'+esc(ex.name)+'</b>: <span class="num">'+esc(groupSets(ex.sets))+'</span>'+((ex.warm||[]).length?'<div class="muted">Avvicinamento: '+esc(groupSets(ex.warm))+'</div>':'')+'</div>').join('')+((l.dev||[]).length?'<p class="small" style="color:'+devColor(l.devTot)+'"><b>Rispetto al teorico'+(l.devTot!=null?' ('+sgn(l.devTot)+')':'')+':</b> '+esc(l.dev.map(devText).join(' · '))+'</p>':'')+((l.skipped||[]).length?'<p class="small muted">Saltati: '+esc(l.skipped.map(x=>x.name+(x.done?' ('+x.done+'/'+x.planned+')':'')).join(', '))+'</p>':'')+(l.notes?'<p class="small muted" style="white-space:pre-wrap">'+esc(l.notes)+'</p>':'')+'</div>'}
  const pd=Object.keys(S.days).filter(k=>!days||dms(k)>=dms(today())-(days-1)*864e5).sort().reverse();
  if(pd.length)b+='<h2>Peso, calorie e mobilità</h2><div class="tbl"><table><thead><tr><th>Data</th><th>Peso</th><th>Kcal</th><th>Proteine</th><th>Mob. breve</th><th>Mob. lunga</th></tr></thead><tbody>'+pd.map(k=>{const d=S.days[k];return '<tr><td class="k">'+dlabel(k)+'</td><td class="k">'+fmt(d.bw)+'</td><td class="k">'+fmt(d.kcal,0)+'</td><td class="k">'+fmt(d.prot,0)+'</td><td>'+(d.mobS?'✓':'')+'</td><td>'+(d.mobL?'✓':'')+'</td></tr>'}).join('')+'</tbody></table></div>';
  if(S.mob.length)b+='<h2>Test di mobilità</h2><div class="tbl"><table><thead><tr><th>Data</th><th>Muro</th><th>Scratch dx</th><th>Scratch sx</th><th>Presa LB</th><th>Fastidio</th><th>Accosciata</th></tr></thead><tbody>'+S.mob.map(m=>'<tr><td class="k">'+dlabel(m.id)+'</td><td class="k">'+fmt(m.wall)+'</td><td class="k">'+fmt(m.sr)+'</td><td class="k">'+fmt(m.sl)+'</td><td class="k">'+fmt(m.grip)+'</td><td>'+(m.lbp?'Sì':'No')+'</td><td class="k">'+fmt(m.hold,0)+'"</td></tr>').join('')+'</tbody></table></div>';
  b+='</div>';
  return '<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diario SBD Luca – '+dlabel(today())+'</title><style>'+css.replace(/<\/style/gi,'')+'</style></head><body>'+b+'</body></html>'}

  let h='<h2>Per il coach</h2><p class="small muted">Prepara un riepilogo da mandare al coach: un messaggio da incollare su WhatsApp oppure un file html che apre nel browser, senza account.</p>';
  h+='<label class="f" style="max-width:260px">Periodo<select data-act="expdays">'+[[7,'Ultimi 7 giorni'],[14,'Ultimi 14 giorni'],[28,'Ultime 4 settimane'],[0,'Tutto']].map(([v,l])=>'<option value="'+v+'"'+(v===d?' selected':'')+'>'+l+'</option>').join('')+'</select></label>';
  h+='<h3>Messaggio WhatsApp</h3><textarea id="wa-text" readonly style="min-height:260px;font-size:14px">'+esc(txt)+'</textarea><div class="row" style="margin-top:8px"><button class="btn" data-act="wacopy">Copia messaggio</button><a class="btn ghost" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(txt.length>6000?txt.slice(0,6000):txt)+'">Apri in WhatsApp</a></div><p class="small muted">Se "Apri in WhatsApp" non funziona sul tuo dispositivo, usa Copia e incolla nella chat del coach.</p>';

  h+=S.dl?'<div class="row"><button class="btn" data-act="exphtml">Scarica file html</button></div>':'<p class="small muted">Il salvataggio dei file non è disponibile in questa vista. Apri il diario da claude.ai o dalla versione offline.</p>';
  return h}

function vSet(){const st=S.settings;const dis=ro()?' disabled':'';const cur={};for(const L of ['SQ','BP','DL'])cur[L]=e1Current(L);
  let h='<h2>Massimali di lavoro</h2><p class="small muted">'+(CLAUDE_PROGRAM?'Su questi numeri si calcolano tutti i carichi del programma Claude. "Da settimana" indica da quando vale il numero: da lì si aggiunge la crescita prevista fino alla sett. 11.':'Su questi numeri si calcolano i kg teorici quando la scheda del coach è scritta in percentuale (es. 70% 3x2s), e il totale con il DOTS.')+'</p>';
  if(!ro())h+='<div class="row">'+Object.entries(PRESETS).map(([k,p])=>'<button class="btn ghost sm" data-act="preset" data-v="'+k+'">'+esc(p.label)+'</button>').join('')+'</div>';
  h+='<div class="tbl"><table><thead><tr><th>Alzata</th><th>Massimale</th><th class="cp-only">Da sett.</th><th class="cp-only">+kg/sett.</th><th>Dai log</th></tr></thead><tbody>'+['SQ','BP','DL','DLR'].map(L=>'<tr><td><span class="tag '+L+'">'+LIFT_NAME[L]+'</span></td><td><input id="s-e-'+L+'" inputmode="decimal" value="'+esc(st.e1rm[L])+'"'+dis+' style="width:80px"></td><td class="cp-only"><input id="s-w-'+L+'" inputmode="numeric" value="'+esc(st.e1rmWeek[L])+'"'+dis+' style="width:56px"></td><td class="cp-only"><input id="s-r-'+L+'" inputmode="decimal" value="'+esc(st.rate[L])+'"'+dis+' style="width:64px"></td><td class="k">'+(cur[L]?fmt(r25(cur[L]))+(ro()?'':' <button class="btn ghost sm" data-act="usee1" data-l="'+L+'">Usa</button>'):'–')+'</td></tr>').join('')+'</tbody></table></div>';
  h+='<h2>Corpo e attrezzatura</h2><div class="grid3"><label class="f">Peso obiettivo (kg)<input id="s-bwt" inputmode="decimal" value="'+esc(st.bwTarget)+'"'+dis+'></label><label class="f">Calorie al giorno<input id="s-kcal" inputmode="numeric" placeholder="es. 2300" value="'+esc(st.kcal)+'"'+dis+'></label><label class="f">Proteine (g)<input id="s-prot" inputmode="numeric" value="'+esc(st.prot)+'"'+dis+'></label><label class="f">Bilanciere (kg)<input id="s-bar" inputmode="decimal" value="'+esc(st.bar)+'"'+dis+'></label><label class="f">Dischi in palestra (kg)<input id="s-plates" value="'+esc(st.plates)+'"'+dis+'></label><label class="f cp-only">Scheda predefinita<select id="s-track"'+dis+'><option value="claude"'+(st.track==='claude'?' selected':'')+'>Programma Claude</option><option value="coach"'+(st.track==='coach'?' selected':'')+'>Scheda coach</option></select></label></div>';
  if(!ro())h+='<div class="save-bar"><button class="btn" data-act="saveset">Salva impostazioni</button></div>';
  h+=syncSection();
  if(!OFF)h+='<hr><p class="small muted">Chi apre questa pagina condivisa vede le stesse sedute, gli stessi progressi e lo stesso peso. Può modificarli solo chi ha i permessi di modifica.</p>';
  return h}

const main=document.getElementById('main');
main.addEventListener('input',e=>{const el=e.target;const k=el.dataset.k;if(k&&S.drafts[k]){const d=S.drafts[k];const f=el.dataset.f;
  if(el.dataset.w&&el.dataset.i!=null){const w=d.ex[+el.dataset.i].warm[+el.dataset.j];w[f]=el.value;if(f==='kg')w.auto=false;persistDraft(k);return}
  if(el.dataset.i!=null&&el.dataset.j!=null){const ex=d.ex[+el.dataset.i];const s=ex.sets[+el.dataset.j];s[f]=el.value;if(f==='kg'&&s.auto)s.auto=false;
    if(f==='kg'&&s.role==='top'){const tk=num(el.value);ex.sets.forEach((x,jj)=>{if(x.auto&&tk){x.kg=r25(tk*(1-x.pct/100));const inp=main.querySelector('input[data-k="'+k+'"][data-i="'+el.dataset.i+'"][data-j="'+jj+'"][data-f="kg"]:not([data-w])');if(inp)inp.value=x.kg;const th2=main.querySelector('[data-th="'+el.dataset.i+'-'+jj+'"]');if(th2&&x.plan&&x.plan.kg)th2.classList.toggle('off',Math.abs(x.kg-x.plan.kg)>=0.01)}})}
    if(f==='kg'){const jn=+el.dataset.j,tk0=num(el.value);ex.sets.forEach((x,jj)=>{if(x.ref===jn&&x.pct!=null){const v=tk0?r25(tk0*(1-x.pct/100)):null;x.plan=Object.assign({},x.plan,{kg:v});if(x.auto){x.kg=v==null?'':v;const inp=main.querySelector('input[data-k="'+k+'"][data-i="'+el.dataset.i+'"][data-j="'+jj+'"][data-f="kg"]:not([data-w])');if(inp)inp.value=x.kg}const th2=main.querySelector('[data-th="'+el.dataset.i+'-'+jj+'"]');if(th2){th2.textContent=v?fmt(v):'–';th2.classList.toggle('off',v!=null&&num(x.kg)!=null&&Math.abs(num(x.kg)-v)>=0.01)}}})}
    if(f==='kg'){const th=main.querySelector('[data-th="'+el.dataset.i+'-'+el.dataset.j+'"]');if(th&&s.plan&&s.plan.kg){const v=num(el.value);th.classList.toggle('off',v!=null&&Math.abs(v-s.plan.kg)>=0.01)}
      const pl=main.querySelector('[data-pl="'+el.dataset.i+'"]');if(pl&&(s.role==='top'||+el.dataset.j===0))pl.textContent=plates(num(el.value));
      const isWork=s.role==='top'||(+el.dataset.j===0&&!ex.sets.some(x=>x.role==='top'));const wk=num(el.value);if(isWork&&wk&&ex.warm&&ex.warm.length<=1&&!ex.warm.some(w=>w.done)){ex.warm=warmFor(wk,num(s.reps));const det=main.querySelector('details.warmd[data-wopen="'+el.dataset.i+'"]');if(det)det.outerHTML=warmHtml(k,ex,+el.dataset.i,'')}
      else if(isWork&&wk&&ex.warm){const bar=num(S.settings.bar)||20;ex.warm.forEach((w,jj)=>{if(w.auto&&!w.done&&w.p){w.kg=Math.max(bar,r25(wk*w.p));const inp=main.querySelector('input[data-w="1"][data-k="'+k+'"][data-i="'+el.dataset.i+'"][data-j="'+jj+'"][data-f="kg"]');if(inp)inp.value=w.kg}})}}}
  else if(f==='elbow'){d.elbow=+el.value;const pv=document.getElementById('painv');if(pv){pv.textContent=d.elbow+'/10';pv.className='pain '+(d.elbow>=6?'p2':d.elbow>=4?'p1':'p0')}}
  else d[f]=el.value;persistDraft(k);if(el.dataset.i!=null&&!el.dataset.w&&(f==='kg'||f==='reps'))refreshEnd(k);return}
  if(el.id==='ce-text'||el.id==='ce-title'){S.editCoach[el.id==='ce-text'?'text':'title']=el.value}
  if(el.dataset.ceLift!=null){S.editCoach.lifts=S.editCoach.lifts||{};S.editCoach.lifts[el.dataset.ceLift]=el.value}
  if(el.id==='cd-date'){S.corpoDate=el.value}});
main.addEventListener('toggle',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.wopen!=null&&S.drafts[t.dataset.k]){const ex=S.drafts[t.dataset.k].ex[+t.dataset.wopen];if(ex)ex.warmOpen=t.open}},true);
main.addEventListener('change',e=>{const el=e.target;if(el.id==='sync-file'){const f=el.files&&el.files[0];if(f)f.text().then(syncImportText).catch(()=>toast('File non leggibile'));el.value='';return}if(el.dataset.act==='expdays'){S.expDays=+el.value;render();return}if(el.dataset.act==='skipdays'){S.skipDays=+el.value;render();return}if(el.dataset.act==='selw'){const w=+el.value;S.sel.claude={w,s:sessionsOf(w)[0]};render()}

main.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;const a=b.dataset.act;const k=b.dataset.k;const d=k?S.drafts[k]:null;
